[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopub"
version = "0.1.0"
description = "Automated news curation, WordPress publishing and social syndication for a fleet of marketing blogs"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["autopub", "autopub.social"]

[tool.setuptools.package-data]
autopub = ["models/*.onnx", "models/*.md", "fonts/*.ttf", "fonts/*.txt"]   # the YuNet face model and the brand typefaces ship inside the package

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
