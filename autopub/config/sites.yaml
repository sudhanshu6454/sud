# Fleet configuration. One entry per WordPress site.
# Add site 4 and 5 by copying a block, then run `make compose` to regenerate docker-compose.yml.
#
# `key` is the suffix used for every environment variable that belongs to a site, e.g.
#   WP_MENTALIST_APP_PASSWORD, TWITTER_MENTALIST_API_KEY, FACEBOOK_MENTALIST_PAGE_ID ...

settings:
  interval_minutes: 60           # how often the scheduler looks for fresh news: one cycle an hour
  dedupe_across_sites: true      # never publish the same source story on two sites
  request_timeout: 30
  llm_model: claude-opus-5
  llm_effort: medium
  min_gap_minutes_between_posts: 20   # per site, checked when a cycle starts; with max_posts_per_run 1
                                      # each site publishes at most one article per cycle, so an hour apart
  # Candidates are scored 0-10 against each site's beat before anything is written, so selection is
  # not just "newest item that survived the keyword filter". Inspect it without publishing:
  #   python -m autopub sources --site SCREENSTAT --rank
  # Raise for a narrower site, lower if a site goes quiet, 0 to switch it off.
  min_relevance: 5
  rank_pool: 40                       # how many of the newest candidates get scored
  # Twice a day each site's Instagram post is a detailed carousel instead of a single card: the first
  # article published at or after each of these hours (in `timezone`) goes out as the feed card plus
  # up to eight content slides and a closing slide, and as a multi-photo post on the Facebook Page.
  # The slot is spent only when a carousel actually goes up. [] switches carousels off.
  carousel_hours: [9, 18]
  # Video, the same way: the first article at or after each of these hours also goes out as a reel on
  # Instagram and a video post on the Facebook Page, built from its story frames (about 20-30 seconds,
  # silent, the brand ground, a progress bar). [] switches it off.
  reel_hours: [12, 21]
  reel_share_to_feed: true            # reels appear in the profile grid as well as the Reels tab
  # The reel's narration. Local voices need no key: Kokoro af_heart / af_bella (female), am_michael
  # (male), bf_emma / bm_george (British); Piper en_US-ryan-high. A real Indian English voice needs a
  # cloud key, free at this volume: azure:en-IN-AartiNeural (AZURE_SPEECH_KEY + AZURE_SPEECH_REGION in
  # .env) or google:en-IN-Neural2-A (GOOGLE_TTS_API_KEY). "" = silent.
  reel_voice: af_heart
  # Music under the reel, matched to the story's mood (upbeat, calm, serious, nostalgic). Your own
  # licensed tracks go in /data/music/<mood>/ and are used first; otherwise a bed is composed.
  reel_music: true
  # Ad features on the sites that set nostalgia to true: five a day, this week's viral ad film and a
  # classic revisited in turn (current at the 1st, 3rd and 5th hour, nostalgic at the 2nd and 4th),
  # the official YouTube film embedded, written in each site's own format.
  ad_hours: [9, 12, 15, 18, 21]
  # The film itself, not a narrated review: the brand's own YouTube upload is fetched (yt-dlp), the
  # article carries it as a self-hosted video, and the reel is the film inside the site's frame with
  # its own sound, cut at ad_clip_max_seconds, credited on the frame and in the caption. The rights
  # in the film stay with the brand; Instagram's rights matching can mute or remove such a reel.
  # Uploads that are not the brand's own are never fetched; those stay embeds.
  repost_ads: true
  ad_clip_max_seconds: 120
  # yt-dlp player clients in order; the android one is served without YouTube's sign-in wall from
  # a server address. If YouTube still insists, export a cookies.txt from a signed-in browser into
  # /data and name it here (a path inside the container).
  ad_clip_player_clients: [android, web]
  ad_clip_cookies: ""
  # Follow-ups: one "Steal this" card a day (the first article after steal_hour that offers a reusable
  # tactic) and one debate story a day (the first after debate_hour that raises an arguable question),
  # each posted a while after its article so the day's posts spread out. The throwback's hot take
  # follows the same way. The debate story goes out at half the delay.
  # ScreenStat's actor scorecards: five a day, an actor's career in numbers (films, hits, flops, return
  # on budget) with every figure read from Wikipedia. The first cycle at or after each hour publishes one.
  scorecard_hours: [8, 11, 14, 17, 20]
  # Instagram allows 100 API publishes per account a day and every story frame counts as one. A story
  # sequence (cover, 1-3 text frames, closing) therefore goes out for every 3rd news article; the ad
  # features and scorecards always get theirs. 1 = every article.
  story_every: 3
  steal_hour: 11
  debate_hour: 17
  followup_delay_minutes: 120
  timezone: Asia/Kolkata

sites:
  - key: MENTALIST
    domain: marketingmentalist.in
    name: Marketing Mentalist
    tagline: The psychology behind marketing that works
    niche: >
      Consumer psychology, behavioural science in marketing, branding, positioning,
      persuasion, pricing psychology, storytelling and brand strategy. Explain the
      "why" behind campaigns and buying behaviour.
    audience: Brand managers, founders and marketers in India and worldwide who want to understand what makes people buy.
    tone: Insightful, analytical, slightly playful, confident. Uses examples and frameworks.
    category: Marketing Psychology
    categories: [Marketing Psychology, Branding, Consumer Behaviour, Pricing Psychology, Storytelling]
    max_posts_per_run: 1
    max_age_hours: 72
    min_words: 250
    include_keywords: []
    exclude_keywords: [sponsored, giveaway, coupon code, casino, betting]
    feeds:
      - https://www.brandingstrategyinsider.com/feed
      - https://www.behavioraleconomics.com/feed/
      - https://insidebe.com/feed/
      - https://www.nirandfar.com/feed/
      - https://brandequity.economictimes.indiatimes.com/rss/marketing
      - https://www.campaignlive.co.uk/rss/news
      - https://www.marketingdive.com/feeds/news/
      - https://digiday.com/feed/
      - https://www.convinceandconvert.com/feed/
      - https://blog.hubspot.com/marketing/rss.xml
      # added 2026-09-22: the pool above ran dry at one article an hour. Each of these was checked live
      # (valid RSS, items within a day) and none is read by another site, so cross-site dedupe does not
      # eat them. The beat ranker still decides what is on-topic.
      - https://www.marketingsociety.com/rss.xml                              # brand strategy essays
      - https://www.ipsos.com/en/rss.xml                                      # consumer research
      - https://www.fastcompany.com/co-design/rss                             # branding and identity
      - https://www.afaqs.com/rss                                             # Indian advertising, ~50 items
      - https://brandequity.economictimes.indiatimes.com/rss/advertising      # sister section to /marketing
      - https://retail.economictimes.indiatimes.com/rss/topstories            # Indian consumer behaviour
    google_news_queries:
      - consumer psychology marketing
      - brand strategy India
      - pricing psychology
      - consumer behaviour brands India
      - why this ad went viral
    hashtags: [MarketingPsychology, Branding, ConsumerBehaviour, MarketingMentalist]
    brand:                          # ink ground, signal-orange accent, bone type; the bow-tie mark on covers
      primary: "#0a0908"
      accent: "#b8492f"
      text: "#f7f5ef"
      logo: brand/marketing-mentalist-logo.png
      font: InstrumentSans   # the typeface the site itself uses, for the share cards
    socials: [twitter, facebook, instagram, linkedin, pinterest, telegram, threads, instagram_story, facebook_story, instagram_reel, facebook_video]
    nostalgia: true              # five ad features a day (viral now, throwback), at settings.ad_hours

