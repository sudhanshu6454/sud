name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopub/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r autopub/requirements-dev.txt
      - run: cd autopub && python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd pulse-worker && npm test
      # runs the validation tests and, through them, node tests/model-equality.mjs - the eight
      # HANDOVER-WORLD acceptance fixtures plus the plugin/worker model-copy hash check
      - run: php plugins/screenstat-pulse/tests/run-tests.php
      # the link-in-bio plugin: syntax on every file, then a render of each brand's page without WordPress
      - run: for f in plugins/fleet-linkinbio/*.php plugins/fleet-linkinbio/includes/*.php; do php -l "$f"; done
      - run: for h in marketingmentalist.in crazy4marketing.com marketingjunkies.in screenstat.in; do php plugins/fleet-linkinbio/tests/preview.php $h | grep -q "Latest stories" || exit 1; done
      - run: python infra/gen_compose.py --check
      - run: python -m py_compile infra/dns.py infra/gen_compose.py infra/wire-meta-socials.py infra/linkedin-auth.py infra/x-auth.py
      - run: bash -n infra/bootstrap.sh infra/wp/init-sites.sh infra/wp/deploy-plugins.sh infra/wp/deploy-themes.sh infra/wp/legal-pages.sh infra/linode/provision.sh infra/db/init-databases.sh
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
  # The affiliate platform (affiliate/): typecheck, unit tests and the pg-mem money-loop demo, then the
  # same migrations + seeds + demo against a real Postgres 16, and a production build of the shop.
  # pnpm's version comes from affiliate/package.json ("packageManager"); pnpm/action-setup fails on a
  # second, different version in its own config, so none is given here.
  affiliate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiliate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paparazzi
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: paparazzi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paparazzi -d paparazzi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://paparazzi:ci@localhost:5432/paparazzi
      FLEET_SITES_YAML: ${{ github.workspace }}/autopub/config/sites.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: affiliate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: ./node_modules/.bin/vitest run
      # end-to-end money loop on pg-mem (51 assertions)
      - run: ./packages/api/node_modules/.bin/tsx scripts/demo-money-loop.ts
      - run: pnpm --filter @paparazzi/web build
      # the real thing: migrations 0001-0005, the demo seed, the fleet seed (five sites + TEST programme)
      - run: node db/migrate.mjs
      - run: ./packages/api/node_modules/.bin/tsx db/seed.ts
      - run: ./packages/api/node_modules/.bin/tsx db/seed-fleet.ts --with-demo-programme
      # the same money loop on a scratch database created on the CI Postgres and dropped at exit
      - run: DEMO_TARGET=postgres ./packages/api/node_modules/.bin/tsx scripts/demo-money-loop.ts
