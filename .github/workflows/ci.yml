name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopub/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r autopub/requirements-dev.txt
      - run: cd autopub && python -m pytest -q
      - run: python infra/gen_compose.py --check
      - run: python -m py_compile infra/dns.py infra/gen_compose.py
      - run: bash -n infra/bootstrap.sh infra/wp/init-sites.sh infra/linode/provision.sh infra/db/init-databases.sh
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
