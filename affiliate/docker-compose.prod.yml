# Production compose for Afflino (afflino.com): the edge (Caddy), api,
# redirect, workers, web and the one-shot migrate runner.
#
# Two shapes, one file:
#   * single host (the pilot on the owner's Linode): add
#     docker-compose.single-host.yml, which runs Postgres 16 and Redis 7 next
#     to the services and points DATABASE_URL / REDIS_URL at them:
#       docker compose -f docker-compose.prod.yml -f docker-compose.single-host.yml up -d --build
#   * managed databases (an option, docs/infrastructure-recommendation.md):
#     this file alone, with DATABASE_URL and REDIS_URL set to the provider's
#     private endpoints.
# DATABASE_URL and REDIS_URL are therefore not refused here when empty (the
# override supplies them, and compose checks each file on its own); an empty
# value still stops the stack: migrate exits "DATABASE_URL is not set" and
# nothing else starts, and api, redirect and workers refuse to boot under
# NODE_ENV=production without REDIS_URL.
#
# THERE ARE NO SECRETS IN THIS FILE. Every value comes from the environment
# (.env.prod.example lists each one: required or optional, secret or not,
# default). Only these are required: JWT_SECRET and STUB_WEBHOOK_SECRET, plus
# POSTGRES_PASSWORD with the single-host override or DATABASE_URL and
# REDIS_URL without it. Everything else has a production default:
# SITE_HOST=afflino.com, REDIRECT_BASE_URL=https://${SITE_HOST},
# SITE_URL=https://${SITE_HOST}, SITE_INDEXING=off (pre-launch: noindex),
# TRUST_PROXY=loopback,uniquelocal. WEB_API_TOKEN and WEB_PLACEMENT_ID are
# optional: until both are set the web renders labelled TEST demo data, so
# the first deploy is `up` alone, then the seed, the token and the links
# (README.md "Deploying afflino.com"), then `up -d web` again.
#
# Public surface: ONLY the edge listens on all interfaces (80/tcp, 443/tcp,
# 443/udp, IPv4 and IPv6; host networking, so ufw applies to it). api (3000),
# redirect (3001) and web (3002) publish on 127.0.0.1 for the edge, host-side
# checks and operator scripts; Docker's published ports bypass ufw, which is
# why nothing else may be published publicly. Plain-HTTP test mode for the
# edge (no certificates, 127.0.0.1:8088): add docker-compose.edge-test.yml.
# The Linode installer (deploy/linode/install.sh) runs this file with
# docker-compose.single-host.yml and --env-file /etc/afflino/afflino.env.
#
# Images are built from ./docker/Dockerfile.* (node:22-alpine, pnpm via
# corepack, non-root `node` user); the edge is the stock caddy:2-alpine with
# ./docker/Caddyfile mounted. docker/README.md documents the layout and the
# smoke test.
#
# Seeds and operator scripts (re-runnable; db/README.md, docker/README.md
# "Operator scripts"). A re-run must read the same network file as the first
# run: for the operator's own network set NETWORK_FILE=/app/config/network.yaml
# and uncomment the migrate volume below; -e NODE_ENV=production then makes a
# lost NETWORK_FILE fail instead of seeding the TEST example:
#   docker compose -f docker-compose.prod.yml -f docker-compose.single-host.yml run --rm -T -e NODE_ENV=production migrate ./node_modules/.bin/tsx db/seed-network.ts
#   docker compose -f docker-compose.prod.yml -f docker-compose.single-host.yml run --rm -T migrate ./node_modules/.bin/tsx db/seed-network.ts --with-demo-programme
#   (--with-demo-programme adds the TEST programme and the shop placement reported as
#    web_placement_id → WEB_PLACEMENT_ID; it refuses to run with NODE_ENV=production, by design)
#
# A database migrated before schema_migrations tracking existed needs, once:
#   docker compose -f docker-compose.prod.yml -f docker-compose.single-host.yml run --rm migrate node db/migrate.mjs --baseline

# Fixed project name: containers, the network and the volumes are afflino_*
# wherever the checkout lives (a throwaway rehearsal passes -p <other name>).
name: afflino

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The only public entry: TLS (automatic certificates for SITE_HOST and
  # www.SITE_HOST only), www → apex, /r/* → redirect, everything else → web
  # (which proxies /api/* to the API). Overwrites client-supplied
  # X-Forwarded-For / X-Real-IP / Forwarded; no access log. docker/Caddyfile.
  #
  # Host networking: Caddy listens on the server's own 80/tcp, 443/tcp and
  # 443/udp, IPv4 and IPv6, so it sees each client's real address (a port
  # Docker publishes would reach IPv6 clients through Docker's userland proxy,
  # which replaces their address with the compose network's gateway), and
  # ufw's rules apply to it. It reaches redirect and web on their 127.0.0.1
  # ports below; they see it as the compose network's private gateway, which
  # TRUST_PROXY trusts.
  edge:
    image: caddy:2-alpine
    network_mode: host
    environment:
      SITE_HOST: ${SITE_HOST:-afflino.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
      EDGE_ADDRESS: ${SITE_HOST:-afflino.com}, www.${SITE_HOST:-afflino.com}
      REDIRECT_UPSTREAM: 127.0.0.1:3001
      WEB_UPSTREAM: 127.0.0.1:3002
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Started, not healthy: the edge must come up (and fetch certificates)
      # even while an upstream is still starting; it answers 502 until then.
      redirect:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: paparazzi/api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      API_HOST: "0.0.0.0"
      API_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (a long random secret; it also signs WEB_API_TOKEN)}
      # Public origin of tracked links: every link is REDIRECT_BASE_URL/r/<token>,
      # served by the edge's /r/* route.
      REDIRECT_BASE_URL: ${REDIRECT_BASE_URL:-https://${SITE_HOST:-afflino.com}}
      # Trust X-Forwarded-For only from loopback and private peers: the edge
      # and the web's /api proxy on the compose network (docker/Caddyfile).
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  redirect:
    build:
      context: .
      dockerfile: docker/Dockerfile.redirect
    image: paparazzi/redirect:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      REDIRECT_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      # The edge is the peer; Caddy has already replaced X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      # Secret for clicks.context.ip_hash = HMAC-SHA256(key, client address).
      # Empty = the plain SHA-256 (reversible for IPv4 by enumeration). Set it
      # before the first real click and never change it (hashes made under
      # different keys do not compare).
      IP_HASH_KEY: ${IP_HASH_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  workers:
    build:
      context: .
      dockerfile: docker/Dockerfile.workers
    image: paparazzi/workers:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      STUB_WEBHOOK_SECRET: ${STUB_WEBHOOK_SECRET:?STUB_WEBHOOK_SECRET is required (a long random secret)}
      RETENTION_CLICK_CONTEXT_DAYS: ${RETENTION_CLICK_CONTEXT_DAYS:-365}
      RETENTION_CONVERSION_RAW_DAYS: ${RETENTION_CONVERSION_RAW_DAYS:-365}
      RETENTION_OUTBOX_DAYS: ${RETENTION_OUTBOX_DAYS:-365}
      RETENTION_CRON: ${RETENTION_CRON:-0 3 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # The Afflino web app (Next.js standalone): marketing site, app areas, shop.
  # The browser talks to /api/* on the web origin; the web server proxies that
  # to API_BASE at request time and calls the API itself with WEB_API_TOKEN
  # (server-side only, never sent to the browser).
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the browser bundle. "/api" = the same-origin proxy (default);
        # an absolute https URL makes the browser call the API directly instead.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
    image: paparazzi/web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      API_BASE: ${API_BASE:-http://api:3000}
      # Optional, both: until they are set the shop renders TEST demo data with
      # a "Demo data" badge. WEB_API_TOKEN = read-only publisher_analyst bearer
      # (a secret; minted with the api image); WEB_PLACEMENT_ID =
      # web_placement_id from seed-network.
      WEB_API_TOKEN: ${WEB_API_TOKEN:-}
      WEB_PLACEMENT_ID: ${WEB_PLACEMENT_ID:-}
      # Canonical URLs, og:url, robots.txt and the sitemap.
      SITE_URL: ${SITE_URL:-https://${SITE_HOST:-afflino.com}}
      # "on" opens the site to search engines. Anything else (the default,
      # off) = pre-launch: robots.txt Disallow: /, an empty sitemap and
      # noindex,nofollow on every page, because the public pages carry
      # placeholder prices, fees, TDS and legal stubs (lib/site-copy.ts).
      SITE_INDEXING: ${SITE_INDEXING:-off}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Afflino}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # One-shot migration runner: `node db/migrate.mjs` against DATABASE_URL, then
  # exits; the app services wait for it to succeed. The same image runs the
  # seeds (commands in the header). NODE_ENV is intentionally unset in the image
  # so `seed-network.ts --with-demo-programme` can run; pass -e NODE_ENV=production
  # to a `run` when that guard is wanted.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    image: paparazzi/migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      # The network file seed-network.ts reads. Unset → the TEST example the image
      # ships (/app/db/network.example.yaml).
      NETWORK_FILE: ${NETWORK_FILE:-}
      # seed-network creates the shop's own `web` property for this host (and, with
      # --with-demo-programme, the placement reported as web_placement_id).
      # Default: the site's own host.
      WEB_HOST: ${WEB_HOST:-${SITE_HOST:-afflino.com}}
    # Optional, to seed your own network instead of the TEST example: save it as
    # network.yaml next to this file (gitignored), uncomment the two lines below
    # and set NETWORK_FILE=/app/config/network.yaml.
    # volumes:
    #   - ./network.yaml:/app/config/network.yaml:ro
    command: ["node", "db/migrate.mjs"]
    restart: "no"
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
