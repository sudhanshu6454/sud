  /v1/editorial/assets/{id}:
    post:
      tags: [Editorial]
      summary: 'An asset''s licence metadata and frame screen'
      description: |
        Roles: network_admin, editor, rights_reviewer. Licence (commercial
        reuse, territory, expiry, source, copyright owner, author, acquisition,
        assignment reference), exclusion flags (live performance, minor in
        frame, bystanders, sensitive location) and the editor's frame screen
        (passed / rejected: no voyeuristic or body-zoom framing). Anything that
        widens what may be shown (commercial reuse to yes, a territory that
        newly covers India, a later or no expiry, a live performance cleared,
        the licence text or the chain of title recorded or changed) is the
        rights reviewer's alone (403 otherwise; `widened` lists it, with its
        own audit row); minor in frame, bystanders and sensitive location are
        never cleared (403). A new `public_url` sends the frame screen back to
        `unscreened` unless the same request records it.
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_url: { type: [string, 'null'], format: uri }
                license: { type: string }
                commercial_reuse: { type: string, enum: [yes, no, unknown] }
                territory: { type: [string, 'null'], example: IN }
                expires_at: { type: [string, 'null'] }
                screen_status: { type: string, enum: [unscreened, passed, rejected] }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/editorial/instant-links:
    post:
      tags: [Editorial]
      summary: 'Instant links: an amazon.in URL or ASIN → offer + tagged into a piece + tracked links'
      description: |
        Roles: network_admin, editor. `piece_id` is required (422 without):
        every link printed in a look's post is scoped to its tagged item, so a
        takedown pauses it. The product text (the operator's own words) is
        checked before anything is written: never a celebrity's name (any in
        the organisation), never endorsement wording, for SIMILAR never the
        piece's own celebrity (422, no product text changed). The offer
        through the Amazon offers path (canonical /dp/<ASIN>, no price until the
        product API gives one); the product tagged SIMILAR (default) or EXACT
        (evidence required; pending until a second person approves); the same
        product in the same piece again reuses its item. Tracked links for the
        chosen in-house pages (owner-operated Facebook / Instagram / web
        declared to the account, each with its own tracking ID; refusals per
        page) — withheld while the celebrity's rights do not allow a shoppable
        page, and while an EXACT tag waits for its second person
