                celebrity_id: { $ref: '#/components/schemas/Uuid' }
                look_id: { $ref: '#/components/schemas/Uuid' }
                reason_code: { type: string, enum: [rights_holder_request, legal_notice, court_order, licence_expired, privacy_request, counsel_instruction, operator_error, other] }
                reason_note: { type: [string, 'null'], maxLength: 500 }
                requester_ref: { type: [string, 'null'], maxLength: 200, description: 'an opaque reference to the notice; no personal data' }
                requested_at: { type: [string, 'null'], format: date-time, description: 'when the notice was received' }
