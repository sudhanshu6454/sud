    post:
      tags: [Takedowns]
      summary: 'Take down a celebrity (every look) or one look'
      description: |
        Roles: network_admin, editor, rights_reviewer. One transaction: every
        affected look withdrawn (410 on every public endpoint at once), their
        links paused (the redirect serves the paused page), comment-reply rules
        off and queued replies cancelled, a snapshot for the restore, audit rows
        and an outbox event; after commit the route cache is deleted (twice) and
        the web revalidated. Answers the counts, the SLA timestamps and the
        in-house posts the owner deletes on Meta. A second pull of an active
        takedown answers it again (200).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
