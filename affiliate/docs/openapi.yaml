openapi: 3.1.0
info:
  title: Paparazzi Affiliate Commerce Platform — v1 API
  version: 1.0.0
  description: |
    Public v1 API for the Paparazzi Affiliate Commerce Platform (looks, offers,
    links, integrations, earnings, payouts, programmes, publishers, disputes,
    contracts, suspense).

    This spec is generated from the real route handlers in
    `packages/api/src/routes/*.ts` — it documents only endpoints the code
    registers. There is no `GET /v1/links` (links are minted, then resolved
    by the redirect service at `GET /r/{token}`).

    ## Authentication (temporary stub)

    All `/v1/*` endpoints require a Bearer JWT (`Authorization: Bearer <token>`).
    Expected claims: `sub`, `org_id`, `role`. **The JWT verification in
    `src/middleware.ts` (`requireAuth`) is a temporary stub: it trusts the
    token's claims verbatim and must be replaced by a production identity
    provider** with membership validation (`memberships` table), issuer /
    audience / expiry policy. `GET /healthz` is the only unauthenticated route.

    ## Envelopes

    - Success: `{ "data": <payload>, "request_id": "<uuid>" }` (`ok()` helper).
    - Error: `{ "error": { "code": "<ERROR_CODE>", "message": "..." }, "request_id": "<uuid>" }`.
    - Every response carries an `X-Request-Id` header echoing `request_id`.
    - Error `code` is always one of the `ErrorCode` enum values
      (`packages/shared/src/errors.ts`); clients should branch on `code`,
      never on message text.

    ## Idempotency

    POST routes that mutate money or state accept an optional `Idempotency-Key`
    header. The first response (status + body) for a key is stored per-org and
    replayed verbatim on retry with `X-Idempotent-Replay: true`; 5xx responses
    are never stored. `POST /v1/payout-batches` additionally keys the batch row
    itself: a conflict returns the existing batch with `200 { ..., "deduped": true }`.

    ## Tenant scoping

    Every query is tenant-scoped via `org_id` (`tenantQuery` in `src/db.ts`:
    `$1` is always the caller's `org_id`, and unscoped SQL throws). There are
    no cross-org reads or writes. A resource belonging to another org reads as
    `404 NOT_FOUND`, never as a leak.

    ## Money

    All money fields are **integer minor units** (paise for INR), never
    decimals. The CSV connector rejects values like `12.50` outright — money is
    never rounded or truncated. The Amazon.in Associates report import reads
    Amazon's rupee strings (`160.00`) and converts them to paise exactly, as
    text (BigInt, no floats); a value that does not convert exactly (`160.5`,
    `160.005`, `₹160.00`, `1.6e2`) refuses the whole file.

    ## Roles

    Minimal hard-coded role matrix (`requireRole` in `src/middleware.ts`;
    full RBAC is a TODO):
    - `network_admin` — kill switch, contract approval, onboarding, callbacks.
    - `editor` — content + provider-webhook operations.
    - `publisher_owner` — publisher-facing writes (links, disputes, onboarding application).
    - `finance_operator` — prepare/disburse payout batches, suspense ops.
    - `finance_approver` — approve payout batches (maker-checker: the preparer
      cannot approve their own batch → `403 FORBIDDEN`), suspense ops.

    A wrong role yields `403 FORBIDDEN`; a missing/invalid token yields
    `401 UNAUTHORIZED`.

    Celebrity looks (0007) add `rights_reviewer` (counsel's reviewer: the
    only role that sets a celebrity's rights status beyond `blocked` and
    restores a takedown).

    ## Public reads and the Meta webhook (no token)

    `GET /v1/public/{org}/…` (the celebrity looks' public read API: the
    organisation is its public slug) and `/v1/integrations/meta/webhook`
    (Meta's verification GET and signed POST deliveries) take no bearer
    token. Public answers carry `cache-control: public, max-age=30`; they
    never show more than the celebrity's rights allow at that moment and
    never a raw merchant URL (links are `/r/{token}` only).

    ## Error codes

    | code | typical meaning |
    |---|---|
    | `PROGRAMME_NOT_APPROVED` | programme not `active`, or offer URL host not in programme `allowed_domains` |
    | `OFFER_STALE` | offer not `active` or `fresh_until` passed (link minting) |
    | `PROPERTY_FORBIDDEN` | property not `approved` for this org |
    | `PUBLISHER_NOT_ACTIVE` | publisher onboarding not `active`; monetised link minting disabled |
    | `PROPERTY_NOT_OWNER_OPERATED` | the programme (Amazon.in Associates) only allows the operator's own properties: the placement's property has no live `owner_operated` verification |
    | `NOT_FOUND` | unknown route, or resource not in this org |
    | `GONE` | 410: the content was withdrawn by a takedown (a celebrity or a look); never used for content that was never public |
    | `VALIDATION_ERROR` | zod/request validation failed (400) or semantic rejection (422) |
    | `UNAUTHORIZED` | missing/invalid/claim-deficient Bearer token |
    | `FORBIDDEN` | role not allowed, or maker-checker violation |
    | `CONFLICT` | state transition invalid, or reversal exceeds unreversed remainder |
    | `RATE_LIMITED` | reserved — no rate limiter is wired in this build |
    | `UPSTREAM_UNAVAILABLE` | reserved — provider upstream failure |
    | `LEDGER_IMBALANCE` | books don't balance for (org, currency) at payout prepare |
    | `TRANSFER_STATUS_UNKNOWN` | payout rail could not determine a transfer's state |
    | `INTERNAL` | unexpected failure (message not leaked) |
servers:
  - url: http://localhost:3000
    description: Local dev (`API_PORT`, default 3000)
security:
  - bearerAuth: []
tags:
  - name: System
    description: Liveness probe.
  - name: Catalog
    description: Published looks and live offers.
  - name: Links
    description: Tracked redirect link minting with guards.
  - name: Integrations
    description: Provider webhooks (stub-network) and the CSV merchant connector.
  - name: Suspense
    description: Finance/ops queue for unattributed conversions.
  - name: Payouts
    description: Payout batch lifecycle with maker-checker.
  - name: Earnings
    description: Per-publisher lifecycle balances.
  - name: Programmes
    description: Programme kill switch (pause/resume).
  - name: Publishers
    description: Publisher onboarding state machine.
  - name: Disputes
    description: Missing-commission / support tickets.
  - name: Contracts
    description: Publisher–programme contract versioning.
  - name: Public
    description: The public read API of celebrity looks (no token; the organisation by its slug).
  - name: Celebrities
    description: Celebrities and their counsel-owned rights reviews.
  - name: Editorial
    description: Celebrity looks, their outfit piece by piece, product tagging, instant links, storefronts.
  - name: Takedowns
    description: Withdraw a celebrity or a look at once (410 everywhere, links paused), and restore after a new review.
  - name: Replies
    description: Comment replies (keyword → one private reply with the look's afflino.com URL) and the Meta webhook.
  - name: Analytics
    description: Click and reply counts from the daily rollups.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        TEMPORARY STUB — `requireAuth` in `src/middleware.ts` verifies the JWT
        signature against `JWT_SECRET` and trusts the `sub`, `org_id`, `role`
        claims verbatim. Replace with a production IdP (membership validation,
        issuer/audience/expiry policy) before pilot.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: |
        Optional idempotency key. First response per (key, org) is stored and
        replayed with `X-Idempotent-Replay: true`; 5xx is never stored.
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathProviderRef:
      name: providerRef
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        example: stub-9f2c1ab4-…
  headers:
    X-Request-Id:
      description: Echoes the envelope `request_id` for log correlation.
      schema:
        type: string
        format: uuid
    X-Idempotent-Replay:
      description: Present (`true`) when the body is a replay of a stored idempotent response.
      schema:
        type: string
        enum: ['true']
  schemas:
    ErrorCode:
      type: string
      enum:
        - PROGRAMME_NOT_APPROVED
        - OFFER_STALE
        - PROPERTY_FORBIDDEN
        - PUBLISHER_NOT_ACTIVE
        - PROPERTY_NOT_OWNER_OPERATED
        - NOT_FOUND
        - GONE
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - CONFLICT
        - RATE_LIMITED
        - UPSTREAM_UNAVAILABLE
        - LEDGER_IMBALANCE
        - TRANSFER_STATUS_UNKNOWN
        - INTERNAL
      description: Canonical codes from `packages/shared/src/errors.ts`.
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
        request_id:
          type: string
          format: uuid
    SuccessEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id:
          type: string
          format: uuid
      description: Shape of every 2xx body; `data` is operation-specific.
    Uuid:
      type: string
      format: uuid
    MinorUnits:
      type: integer
      minimum: 0
      description: Integer minor units (paise for INR). Never decimals.
    Currency:
      type: string
      minLength: 3
      maxLength: 3
      example: INR
      description: ISO 4217 code; stored uppercase.
    DateTime:
      type: string
      format: date-time
    Role:
      type: string
      enum: [network_admin, editor, publisher_owner, publisher_analyst, finance_operator, finance_approver, rights_reviewer]
    InternalConversionStatus:
      type: string
      enum: [received, pending, approved, declined]
    LedgerDisposition:
      type: string
      enum: [posted, skipped]
      description: |
        `posted` — ledger entries were written; `skipped` — conversion left
        unposted (unattributed click or no approved contract; never guessed).
    # ---- celebrity looks (0007) ----
    RightsStatus:
      type: string
      enum: [unreviewed, editorial, cleared, blocked]
      description: |
        Counsel-owned (default unreviewed). The capability matrix
        (@paparazzi/shared CELEBRITY_RIGHTS_MATRIX, defaults pending counsel)
        caps each: unreviewed / blocked allow nothing; editorial the name
        only, no products; cleared name, image and products at most. The
        review's own max_display / shoppable narrow it further.
    DisplayLevel:
      type: string
      enum: [none, name_only, name_and_image]
    GarmentCategory:
      type: string
      enum: [top, shirt, t_shirt, kurta, dress, saree, lehenga, outerwear, suit, trousers, jeans, skirt, shorts, co_ord_set, ethnic_set, footwear, bag, eyewear, watch, jewellery, belt, headwear, scarf, other]
    Celebrity:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        slug: { type: string }
        aliases: { type: array, items: { type: string } }
        is_minor: { type: boolean }
        never_list: { type: boolean }
        rights_status: { $ref: '#/components/schemas/RightsStatus' }
        max_display: { $ref: '#/components/schemas/DisplayLevel' }
        shoppable: { type: boolean }
        rights_note: { type: [string, 'null'] }
        rights_evidence_ref: { type: [string, 'null'] }
        rights_reviewed_by: { type: [string, 'null'], format: uuid }
        rights_reviewed_at: { type: [string, 'null'], format: date-time }
        takedown_id: { type: [string, 'null'], format: uuid }
        effective:
          type: object
          properties:
            display: { $ref: '#/components/schemas/DisplayLevel' }
            shoppable: { type: boolean }
    PublicItem:
      type: object
      description: One tagged product of a piece. `link.url` is the tracked /r/{token} URL (the look page's own placement); never a merchant URL.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        match: { type: string, enum: [exact, similar] }
        label: { type: string, example: Similar styles }
        detail: { type: string, example: 'Similar style. Demo Star One did not wear or endorse this product.' }
        product:
          type: object
          properties: { brand: { type: string }, model: { type: string }, category: { type: string } }
        variant:
          type: object
          properties: { size_text: { type: [string, 'null'] }, colour: { type: [string, 'null'] } }
        offer:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                connector: { type: string }
                merchant: { type: object, properties: { name: { type: string } } }
                price_minor: { oneOf: [{ $ref: '#/components/schemas/MinorUnits' }, { type: 'null' }] }
                price_as_of: { type: [string, 'null'], format: date-time }
                currency: { $ref: '#/components/schemas/Currency' }
                stock_status: { type: string }
                disclosure: { type: [string, 'null'] }
        link:
          oneOf:
            - type: 'null'
            - type: object
              properties: { url: { type: string, format: uri } }
    PublicPiece:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string, example: The shirt }
        category: { $ref: '#/components/schemas/GarmentCategory' }
        position: { type: integer }
        hotspot:
          description: Only while the still may be shown.
          oneOf:
            - type: 'null'
            - type: object
              properties: { x: { type: number }, y: { type: number } }
        products_shown: { type: boolean }
        exact: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PublicItem' }] }
        similar_heading: { type: string }
        similar: { type: array, items: { $ref: '#/components/schemas/PublicItem' } }
    PublicLook:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        headline: { type: string, example: Spotted at Demo Film Premiere, description: 'Composed from the event and place; never the celebrity''s name (that is in celebrity and non_endorsement).' }
        commercial_label: { type: [string, 'null'], description: 'Null when the page carries no products (a name-only look).' }
        celebrity: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        non_endorsement: { type: string }
        moment:
          type: object
          properties: { event: { type: [string, 'null'] }, place: { type: [string, 'null'] }, date: { type: [string, 'null'], format: date } }
        image:
          oneOf:
            - type: 'null'
            - type: object
              properties: { url: { type: string, format: uri }, credit: { type: [string, 'null'] } }
        source:
          type: object
          properties:
            platform: { type: [string, 'null'] }
            post_permalink: { type: [string, 'null'] }
            storefront: { oneOf: [{ type: 'null' }, { type: object, properties: { slug: { type: string }, name: { type: string } } }] }
        display:
          type: object
          properties: { name: { type: boolean }, image: { type: boolean }, shoppable: { type: boolean } }
        disclosure:
          type: object
          properties: { sponsored: { type: boolean }, affiliate_links: { type: boolean }, amazon_associate: { type: boolean } }
        pieces: { type: array, items: { $ref: '#/components/schemas/PublicPiece' } }
        published_at: { type: [string, 'null'], format: date-time }
    SpottedCard:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        headline: { type: string }
        celebrity: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        non_endorsement: { type: string }
        moment: { type: object }
        image: { oneOf: [{ type: 'null' }, { type: object, properties: { url: { type: string } } }] }
        source: { type: object }
        pieces: { type: integer }
        shoppable: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
    SpottedPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SpottedCard' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        commercial_label: { type: [string, 'null'], description: 'The label at the top of the page (a draft pending counsel); null when no listed look carries products.' }
        facets:
          description: |
            Only on /spotted: the celebrities and live storefronts that have
            public looks now (the same read gate), each with its look count,
            for the feed's filter row.
          type: object
          properties:
            celebrities:
              type: array
              items: { type: object, properties: { slug: { type: string }, name: { type: string }, looks: { type: integer } } }
            storefronts:
              type: array
              items: { type: object, properties: { slug: { type: string }, name: { type: string }, looks: { type: integer } } }
    GateReport:
      type: object
      description: Every check of the publish gate, failing or not.
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items:
            type: object
            properties: { code: { type: string }, ok: { type: boolean }, detail: { type: string } }
    Takedown:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        scope: { type: string, enum: [celebrity, look] }
        celebrity_id: { type: [string, 'null'], format: uuid }
        look_id: { type: [string, 'null'], format: uuid }
        reason_code: { type: string, enum: [rights_holder_request, legal_notice, court_order, licence_expired, privacy_request, counsel_instruction, operator_error, other] }
        reason_note: { type: [string, 'null'] }
        requester_ref: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        actioned_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        actioned_by: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [active, restored] }
        restored_at: { type: [string, 'null'], format: date-time }
        restored_by: { type: [string, 'null'], format: uuid }
        restore_note: { type: [string, 'null'] }
        looks_withdrawn: { type: integer }
        links_paused: { type: integer }
        rules_disabled: { type: integer }
        minutes_to_action: { type: [integer, 'null'] }
        sla: { type: [string, 'null'], enum: [ok, warn, breach, null] }
    ReplyRule:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        look_id: { $ref: '#/components/schemas/Uuid' }
        property_id: { $ref: '#/components/schemas/Uuid' }
        platform_post_id: { type: string }
        keywords: { type: array, items: { type: string } }
        public_reply: { type: [string, 'null'] }
        enabled: { type: boolean }
        disabled_by_takedown_id: { type: [string, 'null'], format: uuid }
        created_at: { type: [string, 'null'], format: date-time }
    # ---- domain models ----
    Look:
      type: object
      description: |
        List item of the consumer catalogue (`GET /v1/looks`). `cover_url` is
        `assets.public_url` of the look's `cover_asset_id` (null when there is
        no public copy, or once the asset's licence `expires_at` has passed);
        `item_count` is the number of `look_items` rows;
        `sponsored` drives the paid-placement disclosure label.
      required: [id, title, locale, category, published_at, source_page, sponsored, cover_url, item_count]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        locale: { type: string, example: en-IN }
        category: { type: string, example: street-style, nullable: true }
        published_at: { $ref: '#/components/schemas/DateTime', nullable: true }
        source_page:
          type: string
          nullable: true
          description: Where the look was spotted (attribution line on the page).
          example: https://example.com/demo-street-style
        sponsored: { type: boolean, example: false }
        cover_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/demo-cover.jpg
        item_count: { type: integer, minimum: 0, example: 3 }
    LookItemProduct:
      type: object
      required: [id, brand, model, category]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        brand: { type: string }
        model: { type: string }
        category: { type: string }
    LookItemVariant:
      type: object
      required: [id, size_text, colour, merchant_sku]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        size_text: { type: string, nullable: true }
        colour: { type: string, nullable: true }
        merchant_sku: { type: string, nullable: true }
    LookItemOffer:
      type: object
      description: |
        The live offer for the item's variant: `offers.status='active'`,
        `fresh_until` in the future AND the offer's programme `active`. The
        cheapest qualifying offer wins (ties by id; an offer without a price
        sorts last). **Never carries `offer_url`** — the consumer only gets
        the tracked link.

        `price_minor` is null when the price may not be shown: a programme
        with a price age limit (`programme_capabilities.price_max_age_hours`;
        Amazon.in Associates: 1 h, the Creators API's "Offers | 1 hour") shows only a price from the merchant's
        product API that is younger than the limit, with its time in
        `price_as_of`. Null means "see the current price at the merchant",
        never zero. `stock_status` follows the same rule (availability is
        under the same age limit): `unknown` whenever such a programme's price
        is not shown. `disclosure` is the programme's own disclosure statement
        (Amazon: "As an Amazon Associate I earn from qualifying purchases.");
        `connector` names the programme's connector, so the shop can show the
        merchant's own call to action and price disclaimer
        (`amazon-associates`: "Buy on Amazon.in").
      required: [id, programme_id, connector, merchant, price_minor, price_as_of, currency, stock_status, fresh_until, disclosure]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        programme_id: { $ref: '#/components/schemas/Uuid' }
        connector: { type: string, example: amazon-associates, description: "programmes.connector of the offer's programme (e.g. stub-network, amazon-associates)." }
        merchant:
          type: object
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { type: string, example: Demo Merchant }
        price_minor:
          oneOf:
            - $ref: '#/components/schemas/MinorUnits'
            - type: 'null'
        price_as_of:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
          description: When the shown price was read from the merchant's product API (null for programmes without a price age limit, and whenever price_minor is null for one with a limit).
        currency: { $ref: '#/components/schemas/Currency' }
        stock_status: { type: string, example: in_stock, description: 'in_stock | out_of_stock | preorder | unknown (an Amazon offer whose price is not shown: before any API refresh or after its hour)' }
        fresh_until: { $ref: '#/components/schemas/DateTime' }
        disclosure: { type: string, nullable: true, description: "The programme's own disclosure statement, when it has one." }
    LookItem:
      type: object
      description: One `look_items` row; items are ordered by `created_at` then `id`.
      required: [id, match_type, evidence, product, variant, offer, link]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        match_type: { type: string, enum: [exact, similar], nullable: true }
        evidence: { type: string, nullable: true }
        product: { $ref: '#/components/schemas/LookItemProduct' }
        variant: { $ref: '#/components/schemas/LookItemVariant' }
        offer:
          oneOf:
            - $ref: '#/components/schemas/LookItemOffer'
            - type: 'null'
          description: Null when the variant has no live offer.
        link:
          oneOf:
            - $ref: '#/components/schemas/Link'
            - type: 'null'
          description: |
            Present only when `placement_id` was given AND an active `links`
            row exists for (placement, offer). `url` is composed exactly as
            `POST /v1/links` composes it (`REDIRECT_BASE_URL + '/r/' + token`).
    LookDetail:
      type: object
      description: |
        `GET /v1/looks/{id}` payload. `status` is always `published` for
        consumer roles (any other status is a 404 for them); `editor` and
        `network_admin` may see every status.
      required: [id, title, locale, category, status, published_at, source_page, sponsored, cover_url, items, placement]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string }
        locale: { type: string, example: en-IN }
        category: { type: string, example: street-style, nullable: true }
        status:
          type: string
          enum: [draft, in_review, ready, published, paused, withdrawn]
        published_at: { $ref: '#/components/schemas/DateTime', nullable: true }
        source_page: { type: string, nullable: true }
        sponsored: { type: boolean }
        cover_url: { type: string, format: uri, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/LookItem' }
        placement:
          description: Echo of the `placement_id` query parameter's row, or null when it was omitted.
          oneOf:
            - type: object
              required: [id, property_id, campaign_id]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                property_id: { $ref: '#/components/schemas/Uuid' }
                campaign_id: { $ref: '#/components/schemas/Uuid' }
            - type: 'null'
    Offer:
      type: object
      required: [id, variant_id, programme_id, merchant_id, price_minor, price_as_of, currency, stock_status, offer_url]
      description: price_minor / price_as_of / stock_status follow the same display rule as LookItemOffer.
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        variant_id: { $ref: '#/components/schemas/Uuid' }
        programme_id: { $ref: '#/components/schemas/Uuid' }
        merchant_id: { $ref: '#/components/schemas/Uuid' }
        price_minor:
          oneOf:
            - $ref: '#/components/schemas/MinorUnits'
            - type: 'null'
        price_as_of:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        currency: { $ref: '#/components/schemas/Currency' }
        stock_status: { type: string, example: in_stock }
        offer_url: { type: string, format: uri }
    Link:
      type: object
      required: [token, url]
      properties:
        token:
          type: string
          description: Opaque redirect token; HMAC-SHA256 signed at mint.
          example: 9f2c1ab4e5d64f7a8b9c0d1e2f3a4b5c
        url:
          type: string
          format: uri
          description: Click URL served by the redirect service.
          example: http://localhost:3001/r/9f2c1ab4e5d64f7a8b9c0d1e2f3a4b5c
    ConversionEvent:
      type: object
      required: [provider_account_id, source_transaction_id]
      properties:
        kind:
          type: string
          enum: [conversion, reversal]
          default: conversion
        provider_account_id: { type: string, minLength: 1, maxLength: 200 }
        source_transaction_id: { type: string, minLength: 1, maxLength: 200 }
        line_id: { type: string, maxLength: 200 }
        returned_click_ref: { type: string, maxLength: 200, description: Matched against clicks.click_id; unknown stays suspense, never guessed. }
        currency: { $ref: '#/components/schemas/Currency' }
        eligible_value_minor: { $ref: '#/components/schemas/MinorUnits' }
        commission_minor: { $ref: '#/components/schemas/MinorUnits' }
        provider_status: { type: string, maxLength: 50, example: approved }
        occurred_at: { $ref: '#/components/schemas/DateTime' }
        provider_revision: { type: integer, minimum: 0, default: 0 }
        reversal_commission_minor:
          type: integer
          exclusiveMinimum: 0
          description: Required when kind=reversal.
        reason: { type: string, maxLength: 500 }
      description: |
        kind=conversion requires currency, eligible_value_minor,
        commission_minor, provider_status, occurred_at. kind=reversal requires
        reversal_commission_minor. Dedupe on
        (provider_account_id, source_transaction_id, line_id); a repeat at the
        same or lower provider_revision returns 200 `{deduped: true}`.
    SuspenseItem:
      type: object
      required: [id, programme_id, programme_name, provider_account_id, source_transaction_id, currency, eligible_value_minor, commission_minor, provider_status, status, reason_code]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        programme_id: { $ref: '#/components/schemas/Uuid' }
        programme_name: { type: string }
        provider_account_id: { type: string }
        source_transaction_id: { type: string }
        returned_click_ref: { type: string, nullable: true }
        returned_tracking_ref: { type: string, nullable: true, description: The tracking ID the provider reported (Amazon.in Associates). }
        currency: { $ref: '#/components/schemas/Currency' }
        eligible_value_minor: { $ref: '#/components/schemas/MinorUnits' }
        commission_minor: { $ref: '#/components/schemas/MinorUnits' }
        provider_status: { type: string }
        status: { $ref: '#/components/schemas/InternalConversionStatus' }
        received_at: { $ref: '#/components/schemas/DateTime' }
        raw: { description: Raw provider event payload, for human evidence review. }
        reason_code:
          type: string
          enum: [CLICK_REF_UNMATCHED, NO_CLICK_REF, TRACKING_ID_UNMAPPED, TRACKING_ID_IS_STORE_DEFAULT, TRACKING_ID_MAPPED_AFTER_SALE, ATTRIBUTION_CONFLICT]
          description: |
            From data only. The reason the ingest path stored, when it stored
            one: TRACKING_ID_UNMAPPED (no mapping for the reported tracking
            ID), TRACKING_ID_IS_STORE_DEFAULT (the account's store ID, shared
            by every unmapped placement), TRACKING_ID_MAPPED_AFTER_SALE (the
            mapping began after the row's date), ATTRIBUTION_CONFLICT (a
            known click whose own tag disagrees with the reported tracking
            ID). Otherwise derived: CLICK_REF_UNMATCHED when a click
            reference was returned, TRACKING_ID_UNMAPPED when only a tracking
            ID was, else NO_CLICK_REF.
        reviewed_at: { $ref: '#/components/schemas/DateTime', nullable: true }
        reviewed_by: { type: string, nullable: true }
        review_note: { type: string, nullable: true }
    EarningsBalance:
      type: object
      required: [pending, approved, collected, payable]
      properties:
        pending: { $ref: '#/components/schemas/MinorUnits', description: Publisher share of conversions still awaiting provider approval. }
        approved: { $ref: '#/components/schemas/MinorUnits', description: Net publisher_liability from posted ledger entries. }
        collected: { $ref: '#/components/schemas/MinorUnits', description: Merchant cash received, pro-rata allocated from merchant_settlements. Never exceeds remitted cash. }
        payable: { $ref: '#/components/schemas/MinorUnits', description: Amounts already allocated to live (non-failed/cancelled) payout batches. }
      description: All values integer minor units, per currency. Suspense (unattributed) conversions are excluded everywhere.
    PayoutBatch:
      type: object
      required: [id, currency, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        currency: { $ref: '#/components/schemas/Currency' }
        status:
          type: string
          enum: [pending_approval, approved, processing, paid, failed, cancelled]
        prepared_by: { type: string, nullable: true }
        approved_by: { type: string, nullable: true }
    PayoutItem:
      type: object
      required: [publisher_id, amount_minor]
      properties:
        publisher_id: { $ref: '#/components/schemas/Uuid' }
        amount_minor: { $ref: '#/components/schemas/MinorUnits' }
    Transfer:
      type: object
      required: [id, provider_ref, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        provider_ref: { type: string, example: stub-9f2c1ab4-… }
        status: { type: string, example: initiated }
    OnboardingState:
      type: string
      enum: [application, identity_review, property_verification, programme_eligibility, contract, active]
      description: Forward-only; one step at a time.
    Publisher:
      type: object
      required: [id, legal_name, country, status, onboarding_state]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        legal_name: { type: string }
        country: { type: string, minLength: 2, maxLength: 2, example: IN }
        status: { type: string, example: pending }
        onboarding_state: { $ref: '#/components/schemas/OnboardingState' }
        created_at: { $ref: '#/components/schemas/DateTime' }
    DisputeKind:
      type: string
      enum: [missing_commission, wrong_amount, unattributed_click, other]
    DisputeStatus:
      type: string
      enum: [open, under_review, resolved, rejected]
    Dispute:
      type: object
      required: [id, kind, subject, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        conversion_id: { $ref: '#/components/schemas/Uuid', nullable: true }
        publisher_id: { $ref: '#/components/schemas/Uuid', nullable: true }
        kind: { $ref: '#/components/schemas/DisputeKind' }
        subject: { type: string }
        claim_ref: { type: string, nullable: true, description: e.g. the merchant's order id, for missing_commission. }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        evidence: { type: object, nullable: true, description: Free-form evidence object. Screenshots alone never create a payable sale. }
        resolution_note: { type: string, nullable: true }
        resolved_by: { type: string, nullable: true }
        resolved_at: { $ref: '#/components/schemas/DateTime', nullable: true }
        created_at: { $ref: '#/components/schemas/DateTime' }
      description: A ticket NEVER creates a payable sale on its own.
    Contract:
      type: object
      required: [id, publisher_id, programme_id, version, publisher_share_bps, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publisher_id: { $ref: '#/components/schemas/Uuid' }
        programme_id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        publisher_share_bps: { type: integer, minimum: 0, maximum: 10000, example: 7000 }
        payout_threshold_minor: { $ref: '#/components/schemas/MinorUnits' }
        status: { type: string, enum: [draft, approved] }
        effective_from: { $ref: '#/components/schemas/DateTime', nullable: true }
        created_at: { $ref: '#/components/schemas/DateTime' }
      description: New version = max+1, starts as draft. Ledger posting only considers approved contracts whose effective_from has arrived. Posted conversions keep their contract_version_id snapshot forever.
    RowError:
      type: object
      required: [row, reason]
      properties:
        row: { type: integer, description: 1-based data-row number; 0 = file-level error. }
        reason: { type: string }
  responses:
    BadRequest:
      description: '400 — request failed validation (VALIDATION_ERROR).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: '401 — missing/invalid Bearer token or claims (UNAUTHORIZED).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: '403 — role not allowed (FORBIDDEN), or a link-guard rejection (PROPERTY_FORBIDDEN, PROGRAMME_NOT_APPROVED, PUBLISHER_NOT_ACTIVE, PROPERTY_NOT_OWNER_OPERATED).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '404 — no route, unknown connector, or resource not in this org (NOT_FOUND).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: '409 — invalid state transition or over-reversal (CONFLICT), or imbalanced books (LEDGER_IMBALANCE).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unprocessable:
      description: '422 — semantic rejection (VALIDATION_ERROR): stale offer (OFFER_STALE), no one above payout threshold, missing click reference on suspense retry, unresolved provider verification on dispute resolve, bad CSV rows.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Gone:
      description: '410 — withdrawn by a takedown (GONE).'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: '503 — the feature is not configured (UPSTREAM_UNAVAILABLE): a secret is unset.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: '429 — the per-client limit of an unauthenticated route (RATE_LIMITED); Retry-After says when to try again.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: '500 — unexpected failure (INTERNAL); message not leaked.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
paths:
  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      description: 'No authentication. Returns { ok: true } (raw body, no envelope).'
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, example: true }

  /v1/looks:
    get:
      tags: [Catalog]
      summary: List published looks
      description: Paginated list of published looks for the tenant. Any authenticated role may browse.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: locale
          in: query
          schema: { type: string, minLength: 2, maxLength: 10 }
        - name: category
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Paginated looks.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [items, page, page_size, total]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Look' } }
                          page: { type: integer, example: 1 }
                          page_size: { type: integer, example: 20 }
                          total: { type: integer, example: 132 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/looks/{id}:
    get:
      tags: [Catalog]
      summary: Get one look with items, live offers and tracked links
      description: |
        Consumer-shop detail view. Any authenticated role.

        Visibility (every refusal is `404 NOT_FOUND`, never 403 — a consumer
        must not learn that a draft exists):
        - the look is not in the caller's organisation → 404
        - the look is not `published` and the caller's role is not `editor`
          or `network_admin` → 404
        - `placement_id` is given but not in the caller's organisation → 404

        Per item, `offer` is the live offer for the variant (active, fresh,
        programme active; cheapest wins) or null. `link` is returned only when
        `placement_id` is given and an active `links` row exists for that
        (placement, offer); it is the tracked redirect URL. The raw merchant
        `offer_url` is never returned by this endpoint.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: placement_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Uuid' }
          description: "Placement to resolve tracked links for. Omitted → `link: null` on every item and `placement: null`."
      responses:
        '200':
          description: The look.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LookDetail' }
              examples:
                withPlacement:
                  value:
                    data:
                      id: 55555555-5555-4555-8555-555555555555
                      title: Demo street-style look
                      locale: en-IN
                      category: street-style
                      status: published
                      published_at: '2026-09-29T00:00:00.000Z'
                      source_page: https://example.com/demo-street-style
                      sponsored: false
                      cover_url: https://cdn.example.com/demo-cover.jpg
                      items:
                        - id: 66666666-6666-4666-8666-666666666666
                          match_type: exact
                          evidence: Demo evidence note
                          product: { id: 77777777-7777-4777-8777-777777777777, brand: Demo Brand, model: Demo Model, category: kurta }
                          variant: { id: 22222222-2222-4222-8222-222222222222, size_text: M, colour: red, merchant_sku: DEMO-SKU-1 }
                          offer:
                            id: 11111111-1111-4111-8111-111111111111
                            programme_id: 33333333-3333-4333-8333-333333333333
                            merchant: { id: 44444444-4444-4444-8444-444444444444, name: Demo Merchant }
                            price_minor: 49900
                            currency: INR
                            stock_status: in_stock
                            fresh_until: '2026-10-29T00:00:00.000Z'
                          link:
                            token: 9f2c1ab4e5d64f7a8b9c0d1e2f3a4b5c
                            url: http://localhost:3001/r/9f2c1ab4e5d64f7a8b9c0d1e2f3a4b5c
                      placement:
                        id: 88888888-8888-4888-8888-888888888888
                        property_id: 99999999-9999-4999-8999-999999999999
                        campaign_id: 12121212-1212-4121-8121-121212121212
                    request_id: 0f0f0f0f-0f0f-4f0f-8f0f-0f0f0f0f0f0f
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/offers:
    get:
      tags: [Catalog]
      summary: List live offers
      description: |
        Only live offers: `status='active'` AND `fresh_until` in the future.
        Stale or inactive offers are never served to publishers. Any authenticated role.
      parameters:
        - name: variant_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: programme_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Live offers (price in minor units).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }
              examples:
                live:
                  value:
                    data:
                      - id: 11111111-1111-4111-8111-111111111111
                        variant_id: 22222222-2222-4222-8222-222222222222
                        programme_id: 33333333-3333-4333-8333-333333333333
                        merchant_id: 44444444-4444-4444-8444-444444444444
                        price_minor: 249900
                        currency: INR
                        stock_status: in_stock
                        offer_url: https://merchant.example/p/handloom-kurta?variant=42
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/links:
    post:
      tags: [Links]
      summary: Mint a tracked redirect link
      description: |
        Mints a tracked redirect link for a placement+offer. Guards (all tenant-scoped):
        - property must belong to the org and be `approved` → `403 PROPERTY_FORBIDDEN`
        - publisher onboarding must be `active` → `403 PUBLISHER_NOT_ACTIVE`
          (pending accounts can draft looks/placements but cannot monetise them)
        - programme must be `active` → `403 PROGRAMME_NOT_APPROVED`
        - offer must be `active` and fresh → `422 OFFER_STALE`
        - offer destination host must be in the programme's `allowed_domains` →
          `403 PROGRAMME_NOT_APPROVED` (no unearnable link is ever minted)
        - placement must belong to the org → `404 NOT_FOUND`
        - the offer must belong to `programme_id` → `403 PROGRAMME_NOT_APPROVED`
        - the placement must be `property_id`'s, in a campaign of that
          property's own publisher → `403 PROPERTY_FORBIDDEN`

        Amazon.in Associates programmes (an Associates account behind the
        programme) add:
        - the account must be active → `403 PROGRAMME_NOT_APPROVED`
        - the placement must be in a campaign FOR this programme (the setup
          CLI creates one per property declared to Amazon) →
          `403 PROPERTY_FORBIDDEN`
        - the placement's property must be on a platform Amazon links may go
          on (Facebook, Instagram, the operator's own website; never
          Snapchat or Telegram) → `403 PROPERTY_FORBIDDEN`
        - the placement's property needs a live `owner_operated`
          verification (Amazon PR 9: links carrying the tag only on "your
          site"; no setting allows third parties) →
          `403 PROPERTY_NOT_OWNER_OPERATED`
        - the stored offer URL must be exactly
          `https://www.amazon.in/dp/<ASIN>` (no tag, no query) →
          `403 PROGRAMME_NOT_APPROVED`
        The redirect then sends `https://www.amazon.in/dp/<ASIN>?tag=<the
        placement's tracking ID, else the store ID>` and never a click id
        (no `subid`, no `ascsubtag`: Amazon's Linking Requirements forbid a
        sub-tag tied to a specific end user); automated clients (named
        link-preview crawlers, generic bot / HTTP-library user agents, no
        user agent), prefetch / prerender / preview requests and HEAD
        requests get a preview page (no click, no tagged URL).

        The latest approved contract version (effective_from arrived) is pinned
        onto the link when one exists. Side effects: warms Redis `route:{token}`
        (best-effort) and appends a `link.created` outbox event. The token is
        HMAC-SHA256 signed (dev-grade: reuses the JWT secret; TODO KMS key).

        Roles: `publisher_owner`, `editor`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id, programme_id, offer_id, placement_id]
              properties:
                property_id: { $ref: '#/components/schemas/Uuid' }
                programme_id: { $ref: '#/components/schemas/Uuid' }
                offer_id: { $ref: '#/components/schemas/Uuid' }
                placement_id: { $ref: '#/components/schemas/Uuid' }
            examples:
              mint:
                value:
                  property_id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                  programme_id: 33333333-3333-4333-8333-333333333333
                  offer_id: 11111111-1111-4111-8111-111111111111
                  placement_id: 55555555-5555-4555-8555-555555555555
      responses:
        '201':
          description: Link minted.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Link' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Role not allowed (`FORBIDDEN`), property not approved or the
            placement not the property's own (`PROPERTY_FORBIDDEN`),
            publisher not onboarded (`PUBLISHER_NOT_ACTIVE`), programme not
            active, offer of another programme or offer host not allow-listed
            (`PROGRAMME_NOT_APPROVED`), a property that is not the operator's
            own on an owner-operated-only programme
            (`PROPERTY_NOT_OWNER_OPERATED`).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                programme-paused:
                  value:
                    error: { code: PROGRAMME_NOT_APPROVED, message: 'Programme is not active' }
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 'Offer stale (`OFFER_STALE`).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/integrations/{connector}/events:
    post:
      tags: [Integrations]
      summary: Provider conversion/reversal webhook
      description: |
        Provider conversion notifications for the stub-network connector
        (`connector` path param allow-list: `stub-network`; anything else is
        `404 NOT_FOUND`). A `provider_account_id` of an Amazon.in Associates
        account, a reversal of an Amazon conversion, or a click ref of an
        Amazon link is `422 VALIDATION_ERROR` (Amazon rows come only through
        `POST /v1/integrations/amazon-associates/reports`).

        **kind=conversion** (default) runs the shared ingestion state machine
        (`src/conversion-ingest.ts`) — the same money path the CSV connector uses:
        - Attribution: `returned_click_ref` is matched against `clicks.click_id`.
          A miss is NOT an error — the conversion is stored with `click_id = NULL`
          (suspense). Attribution is never guessed.
        - Dedupe: `(provider_account_id, source_transaction_id, line_id)` is
          unique (nulls-not-distinct). A repeat at the same or lower
          `provider_revision` returns `200 { "deduped": true }`.
        - Revision ordering: higher revisions update provider_status/revision;
          `received/pending/declined → approved` posts the ledger (idempotent
          entry keys) and snapshots `contract_version_id`. An approval is NEVER
          downgraded — a higher-revision `pending` is logged and ignored, a
          higher-revision `declined`/`reversed` creates a reversal adjustment
          for the full remaining commission.
        - Approved conversions that cannot be attributed or contracted are
          logged and left unposted rather than posted against a guessed publisher.

        **kind=reversal**: partial/full reversal of a recorded conversion.
        `404` when the original is unknown; `409 CONFLICT` when
        `reversal_commission_minor` exceeds the unreversed remainder. Posts
        mirror entries snapshotting the ORIGINAL contract split.

        Roles: `network_admin`, `editor` (machine-to-machine).
      parameters:
        - name: connector
          in: path
          required: true
          schema: { type: string, enum: [stub-network] }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionEvent' }
            examples:
              conversion:
                value:
                  kind: conversion
                  provider_account_id: stub-merchant-001
                  source_transaction_id: txn-2026-09-20-0001
                  returned_click_ref: clk_9f2c1ab4
                  currency: INR
                  eligible_value_minor: 249900
                  commission_minor: 16000
                  provider_status: approved
                  occurred_at: 2026-09-20T10:15:30.000Z
                  provider_revision: 1
              reversal:
                value:
                  kind: reversal
                  provider_account_id: stub-merchant-001
                  source_transaction_id: txn-2026-09-20-0001
                  reversal_commission_minor: 8000
                  provider_revision: 2
                  reason: customer return within window
      responses:
        '202':
          description: Conversion created (or reversal recorded).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [conversion_id]
                        properties:
                          conversion_id: { $ref: '#/components/schemas/Uuid' }
                          adjustment_id: { $ref: '#/components/schemas/Uuid', description: Present on reversal / auto_reversed. }
                          status: { $ref: '#/components/schemas/InternalConversionStatus' }
                          auto_reversed: { type: boolean }
                          deduped: { type: boolean, example: true, description: Present on the 200 dedupe path. }
                          ledger: { $ref: '#/components/schemas/LedgerDisposition' }
              examples:
                created:
                  value:
                    data: { conversion_id: 66666666-6666-4666-8666-666666666666, status: approved, ledger: posted }
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
        '200':
          description: Deduped, status-changed, or auto-reversed (see `data` shape above).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            `VALIDATION_ERROR` — e.g. the conversion cannot be resolved to a
            programme (no attributable click and no single active programme for
            the connector), or a required field for the kind is missing.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/integrations/stub-network/payout-callback:
    post:
      tags: [Integrations]
      summary: Provider payout transfer callback
      description: |
        Stub-network payout rail callback: records the provider's outcome for
        one transfer (`provider_ref`) and rolls the batch status up:
        all `paid` → batch `paid` + ledger entries posted;
        any `failed` → batch `failed`.
        Roles: `network_admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_ref, outcome]
              properties:
                provider_ref: { type: string, minLength: 1, maxLength: 200, example: stub-9f2c1ab4-… }
                outcome: { type: string, enum: [paid, failed, unknown] }
      responses:
        '200':
          description: Callback applied; batch rolled up.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [provider_ref, outcome, payout_batch_id, batch_status, ledger]
                        properties:
                          provider_ref: { type: string }
                          outcome: { type: string, enum: [paid, failed, unknown] }
                          payout_batch_id: { $ref: '#/components/schemas/Uuid' }
                          batch_status: { type: string, enum: [processing, paid, failed] }
                          ledger: { type: string, enum: [posted, skipped, n/a] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/integrations/csv/uploads:
    post:
      tags: [Integrations]
      summary: Upload merchant settlement CSV
      description: |
        File-based merchant settlement import (brief §8). The CSV is POSTed
        inline as a plain string — no multipart (2 MB cap; a deliberate
        sandbox choice). The uploader names `programme_id`, which must exist
        in the org and be `active` (`404` / `422` otherwise). An Amazon.in
        Associates programme, or a `provider_account_id` that is an Amazon
        account's, is `422 VALIDATION_ERROR`: those rows come only through
        `POST /v1/integrations/amazon-associates/reports`.

        Every row goes through the SAME conversion pipeline as the provider
        webhook: idempotency on `(provider_account_id, source_transaction_id,
        line_id)`, `provider_revision` ordering, unknown `returned_click_ref` →
        suspense (`click_id` NULL), ledger posting on approved, same outbox events.

        **All-or-nothing validation**: every row is validated before anything
        is ingested. One bad row → `422 VALIDATION_ERROR` with per-row
        `errors: [{row, reason}]` and zero inserts. `row` is the 1-based
        data-row number (header not counted; blank lines skipped; `0` = file-level).

        Columns (header required, case-insensitive, extra ignored, RFC-4180,
        UTF-8, LF/CRLF): `source_transaction_id` (req), `line_id`,
        `returned_click_ref`, `currency` (req, 3-letter), `eligible_value_minor`
        (req, integer ≥ 0 — decimals rejected), `commission_minor` (req,
        integer ≥ 0), `provider_status` (req: `approved|pending|declined|reversed`,
        case-insensitive; `reversed` behaves as `declined` post-approval),
        `provider_revision` (int ≥ 0, default 0), `occurred_at` (req, ISO 8601).

        Roles: `network_admin`, `editor`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_account_id, programme_id, filename, csv_text]
              properties:
                provider_account_id: { type: string, minLength: 1, maxLength: 200 }
                programme_id: { $ref: '#/components/schemas/Uuid', description: The uploader names the programme (contrast the webhook path, which resolves it). }
                filename: { type: string, minLength: 1, maxLength: 255 }
                csv_text: { type: string, minLength: 1, description: Inline CSV text; 2 MB max. }
            examples:
              upload:
                value:
                  provider_account_id: direct-merchant-009
                  programme_id: 33333333-3333-4333-8333-333333333333
                  filename: settlement-2026-09-20.csv
                  csv_text: "source_transaction_id,currency,eligible_value_minor,commission_minor,provider_status,occurred_at,returned_click_ref\ntxn-0001,INR,249900,16000,approved,2026-09-20T10:00:00.000Z,clk_9f2c1ab4\n"
      responses:
        '202':
          description: File ingested; per-row outcomes returned.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [filename, provider_account_id, programme_id, rows_received, created, deduped, status_changed, auto_reversed, results]
                        properties:
                          filename: { type: string }
                          provider_account_id: { type: string }
                          programme_id: { $ref: '#/components/schemas/Uuid' }
                          rows_received: { type: integer }
                          created: { type: integer }
                          deduped: { type: integer }
                          status_changed: { type: integer }
                          auto_reversed: { type: integer }
                          results:
                            type: array
                            items:
                              type: object
                              required: [row, outcome, conversion_id, status]
                              properties:
                                row: { type: integer }
                                outcome: { type: string, enum: [created, deduped, status_changed, auto_reversed] }
                                conversion_id: { $ref: '#/components/schemas/Uuid' }
                                status: { $ref: '#/components/schemas/InternalConversionStatus' }
                                ledger: { $ref: '#/components/schemas/LedgerDisposition' }
                                auto_reversed: { type: boolean }
                                adjustment_id: { $ref: '#/components/schemas/Uuid', nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            `VALIDATION_ERROR` with top-level `errors: [{row, reason}]`
            (the shared `ErrorCode` union has no CSV-specific code, so the
            per-row detail rides in `errors`). Nothing was ingested.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    required: [errors]
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/RowError' }
              examples:
                row-errors:
                  value:
                    error: { code: VALIDATION_ERROR, message: '2 row(s) failed validation; nothing was ingested' }
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
                    errors:
                      - { row: 2, reason: "commission_minor must be an integer in minor units (no decimals); got '12.50'" }
                      - { row: 3, reason: "provider_status must be one of approved|pending|declined|reversed; got 'bogus'" }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/integrations/amazon-associates/reports:
    post:
      tags: [Integrations]
      summary: Import an Amazon.in Associates earnings report
      description: |
        The Associates Central earnings download (tab-separated, or
        comma-separated), POSTed inline as text (2 MB cap, like the CSV
        connector). **Layout to confirm with a real export**: Amazon's pages
        document the report but not the download's columns; the header is
        read by name through ONE alias table
        (`packages/api/src/amazon/report-format.ts`, `EARNINGS_COLUMNS`):
        required Tracking ID, ASIN, Date Shipped (or Dispatched), Items
        Shipped (or Dispatched), Revenue, Ad Fees (or Earnings); optional
        Returns, Price, Seller, Name, Category, Device Type Group, link type,
        sub-tag. A title line above the header, a BOM and quoted fields are
        handled; an unknown layout, the XML download, another currency, a
        non-exact amount, an ambiguous date (09/10/2026) or a row mixing
        shipped and returned values refuses the whole file (`422`, nothing
        written, `errors: [{row, reason}]`, `row` = 1-based file line).

        Each shipped row goes through the one money path
        (`ingestConversionEvent`): `provider_account_id` = the account's
        `amazon-associates:<store id>`, `source_transaction_id` =
        `amzn-earn:<date>:<ASIN>:<hash of the row's identifying fields>`,
        `line_id` `shipped`, approved at revision 0, eligible value = Revenue,
        commission = Ad Fees (Amazon's figure, never recomputed). Attribution:
        the ONE placement the tracking ID is mapped to (mapping begun on or
        before the row's date), else suspense with the reason (a report's
        sub-tag column is kept as evidence only: no click id is ever put on
        an Amazon URL). Each return row (negative fees) reverses the ONE
        approved sale of the same tracking ID and ASIN dated on or before it
        whose unreversed commission covers it, with a deterministic
        adjustment id, atomically (the conversion row is locked and the
        insert re-checks the remainder); none or several → reported in
        `unmatched_returns`, nothing applied (the operator picks the sale
        with the Amazon CLI's `apply-return`, `amazon.sh returns`, under the
        same deterministic id). A re-import of the same file changes
        nothing; a row imported before with different amounts refuses the
        whole file (`409 CONFLICT`, nothing written). One import at a time
        per account: while another import of the same account runs (up to
        30 s), `409 CONFLICT`, nothing written.

        The generic adapters never write this path: `POST
        /v1/integrations/csv/uploads` with the Amazon programme or the
        account's `provider_account_id`, and `POST
        /v1/integrations/{connector}/events` with that `provider_account_id`
        (conversion or reversal) or a click ref of an Amazon link, answer
        `422 VALIDATION_ERROR`.

        Roles: `network_admin`, `editor`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, report_text]
              properties:
                account_id: { $ref: '#/components/schemas/Uuid', description: The Associates account; optional when the organisation has exactly one. }
                filename: { type: string, minLength: 1, maxLength: 255 }
                report_text: { type: string, minLength: 1, description: The downloaded report as text; 2 MB max. }
            examples:
              earnings:
                value:
                  filename: earnings-2026-09-TEST.tsv
                  report_text: "Fee-Earnings reports (TEST)\nCategory\tName\tASIN\tSeller\tTracking ID\tDate Shipped\tPrice(Rs.)\tItems Shipped\tReturns\tRevenue(Rs.)\tAd Fees(Rs.)\tDevice Type Group\nHome\tDemo Kettle\tB0DEMO0001\tDemo Seller\tdemo-ig-21\t2026-09-20\t1000.00\t1\t0\t1000.00\t160.00\tPHONE\n"
      responses:
        '202':
          description: Report imported.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [filename, account_id, account_ref, programme_id, layout, rows_received, shipped, returns, skipped_zero, results, unmatched_returns]
                        properties:
                          filename: { type: string }
                          account_id: { $ref: '#/components/schemas/Uuid' }
                          account_ref: { type: string, example: 'amazon-associates:demo-21' }
                          programme_id: { $ref: '#/components/schemas/Uuid' }
                          layout:
                            type: object
                            properties:
                              delimiter: { type: string, enum: [tab, comma] }
                              header_row: { type: integer }
                              columns: { type: object, additionalProperties: { type: string }, description: canonical field → the header text it was read from }
                          rows_received: { type: integer }
                          shipped:
                            type: object
                            properties:
                              created: { type: integer }
                              deduped: { type: integer }
                              attributed_click: { type: integer }
                              attributed_tracking_id: { type: integer }
                              suspense: { type: integer }
                          returns:
                            type: object
                            properties:
                              applied: { type: integer }
                              deduped: { type: integer }
                              unmatched: { type: integer }
                          skipped_zero: { type: integer }
                          results:
                            type: array
                            items:
                              type: object
                              required: [row, kind, outcome]
                              properties:
                                row: { type: integer }
                                kind: { type: string, enum: [shipped, return, zero] }
                                outcome: { type: string, enum: [created, deduped, status_changed, auto_reversed, applied, unmatched, skipped] }
                                conversion_id: { $ref: '#/components/schemas/Uuid' }
                                adjustment_id: { $ref: '#/components/schemas/Uuid' }
                                status: { $ref: '#/components/schemas/InternalConversionStatus' }
                                attributed_by: { type: string, enum: [click, tracking_id], nullable: true }
                                ledger: { $ref: '#/components/schemas/LedgerDisposition' }
                                reason: { type: string }
                          unmatched_returns:
                            type: array
                            items:
                              type: object
                              properties:
                                row: { type: integer }
                                tracking_id: { type: string }
                                asin: { type: string }
                                date: { type: string, format: date }
                                fee_minor: { type: integer, description: The row's (negative) fee in paise. }
                                reason: { type: string, enum: [NO_CANDIDATE, AMBIGUOUS] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A row was imported before with different amounts (`CONFLICT`); nothing was written. `errors` names the rows.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    required: [errors]
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/RowError' }
        '422':
          description: The file was refused (`VALIDATION_ERROR`); nothing was written. `errors` says why, per row (`row` = 1-based line of the file; 0 = file-level).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    required: [errors]
                    properties:
                      errors:
                        type: array
                        items: { $ref: '#/components/schemas/RowError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/suspense:
    get:
      tags: [Suspense]
      summary: List unattributed conversions
      description: |
        Finance/ops queue: conversions with `click_id IS NULL` and
        `placement_id IS NULL` (no click, no tracking-ID placement) and
        `status <> 'declined'`, org-scoped. `reason_code`: see SuspenseItem.
        Ordered by `received_at` desc.

        Roles: `finance_operator`, `finance_approver`, `network_admin`.
      parameters:
        - name: connector
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: programme_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: received_from
          in: query
          schema: { $ref: '#/components/schemas/DateTime' }
        - name: received_to
          in: query
          schema: { $ref: '#/components/schemas/DateTime' }
        - name: reviewed
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Suspense page.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [items, limit, offset, total]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/SuspenseItem' } }
                          limit: { type: integer, example: 100 }
                          offset: { type: integer, example: 0 }
                          total: { type: integer, example: 7 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/suspense/{id}/retry:
    post:
      tags: [Suspense]
      summary: Re-run attribution for one suspense row
      description: |
        Binds `click_id` ONLY when the provider-returned click reference
        EXACTLY matches an existing click row (`clicks.click_id =
        conversions.returned_click_ref`) — exact equality, never LIKE, never a
        heuristic. For a row that carries a provider-reported tracking ID
        (Amazon.in Associates) the same rules as ingest apply
        (`resolveAttribution`): a known click whose own tag agrees, else the
        ONE placement that tracking ID is mapped to (mapping begun on or
        before the sale) → `placement_id`. A row with neither reference is
        `422` (nothing deterministic to retry against). A no-match retry
        leaves the row untouched (no audit, no outbox) and says why
        (`reason`). A successful bind writes `audit_log` and emits
        `suspense.attributed`; ledger posting happens downstream off that event,
        never in this endpoint.

        Roles: `finance_operator`, `finance_approver`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Retry outcome.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, attributed]
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          attributed: { type: boolean }
                          click_id: { $ref: '#/components/schemas/Uuid', description: Present when attributed=true through a click. }
                          placement_id: { $ref: '#/components/schemas/Uuid', description: Present when attributed=true through a tracking-ID mapping. }
                          reason:
                            type: string
                            enum: [CLICK_REF_UNMATCHED, TRACKING_ID_UNMAPPED, TRACKING_ID_IS_STORE_DEFAULT, TRACKING_ID_MAPPED_AFTER_SALE, ATTRIBUTION_CONFLICT]
                            description: Present when attributed=false.
              examples:
                bound:
                  value:
                    data: { id: 66666666-6666-4666-8666-666666666666, attributed: true, click_id: 77777777-7777-4777-8777-777777777777 }
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
                no-match:
                  value:
                    data: { id: 66666666-6666-4666-8666-666666666666, attributed: false, reason: CLICK_REF_UNMATCHED }
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` — already attributed (or raced).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: '`VALIDATION_ERROR` — the conversion carries no provider-returned click reference; the platform never guesses a click.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/suspense/{id}/review:
    post:
      tags: [Suspense]
      summary: Mark a suspense row reviewed
      description: |
        Records the human's decision: writes only `reviewed_at`,
        `reviewed_by`, `review_note` + one `audit_log` row. Review NEVER
        changes `click_id` and NEVER posts ledger entries — it is bookkeeping,
        not money movement.

        Roles: `finance_operator`, `finance_approver`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  description: Required evidence note — why the row stays unknown / what was checked.
                  example: Checked provider dashboard for txn-0001; no click record exists for clk_9f2c1ab4. Leaving unattributed.
      responses:
        '200':
          description: Review recorded.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, reviewed_at, reviewed_by, review_note]
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          reviewed_at: { $ref: '#/components/schemas/DateTime' }
                          reviewed_by: { type: string }
                          review_note: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` — already attributed; the review queue only tracks unattributed conversions.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/payout-batches:
    post:
      tags: [Payouts]
      summary: Prepare a payout batch
      description: |
        1. Gate: books must balance for (org, currency) → `409 LEDGER_IMBALANCE`.
        2. Eligible earnings per publisher = publisher share of approved
           conversions past the programme's returns window, minus reversal
           adjustments, minus amounts already in live (non-failed/cancelled)
           batches — then CAPPED by collected cash: per (programme, currency)
           the `merchant_settlements` pool is allocated pro-rata by
           eligible-earnings share.
        3. Only publishers strictly above their payout threshold are included
           (threshold = MAX `payout_threshold_minor` across the publisher's
           approved contracts — conservative).
        4. Creates the batch (`pending_approval`, `prepared_by` = caller) plus
           `payout_items`. Row-level idempotency: on conflict the existing
           batch is returned with `200 { ..., "deduped": true }`.

        Nobody qualifying → `422 VALIDATION_ERROR`.
        Roles: `finance_operator`, `finance_approver`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: { $ref: '#/components/schemas/Currency' }
            examples:
              inr:
                value: { currency: INR }
      responses:
        '201':
          description: Batch prepared.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PayoutBatch'
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/PayoutItem' }
              examples:
                prepared:
                  value:
                    data:
                      id: 88888888-8888-4888-8888-888888888888
                      currency: INR
                      status: pending_approval
                      prepared_by: 00000000-0000-0000-0000-000000000003
                      items:
                        - { publisher_id: 99999999-9999-4999-8999-999999999999, amount_minor: 11200 }
                    request_id: 9f2c1ab4-e5d6-4f7a-8b9c-0d1e2f3a4b5c
        '200':
          description: Idempotent replay — the batch already existed for this key.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PayoutBatch'
                          - type: object
                            required: [deduped]
                            properties:
                              deduped: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`LEDGER_IMBALANCE` — books do not balance for (org, currency).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: '`VALIDATION_ERROR` — no publisher is above their payout threshold.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/payout-batches/{id}/approve:
    post:
      tags: [Payouts]
      summary: Approve a payout batch
      description: |
        Maker-checker: the preparer cannot approve their own batch →
        `403 FORBIDDEN`. Only `pending_approval` batches can be approved →
        `409 CONFLICT` otherwise.
        Roles: `finance_approver`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Batch approved.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/PayoutBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` — wrong role, or you prepared this batch (maker-checker).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/payout-batches/{id}/disburse:
    post:
      tags: [Payouts]
      summary: Disburse a payout batch
      description: |
        Requires `approved` → `409` otherwise. Creates one `payout_transfers`
        row per item (`provider_ref` `stub-<uuid>`, idempotency key
        `transfer:<batch_id>:<publisher_id>`), hands them to the payout rail,
        and moves the batch to `processing`. Re-calling while `processing` is
        idempotent: transfer rows collapse on their idempotency key and the
        rail skips transfers already past `initiated`. The rail can surface
        `TRANSFER_STATUS_UNKNOWN`.
        Roles: `finance_operator`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Batch disbursing.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, status, transfers]
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          status: { type: string, enum: [processing] }
                          transfers:
                            type: array
                            items: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`VALIDATION_ERROR` — batch has no items to disburse.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/payout-transfers/{providerRef}/status-query:
    post:
      tags: [Payouts]
      summary: Query a payout transfer's provider status
      description: |
        Asks the (fake) provider for one transfer's current status and records
        `last_status_query_at`. A transfer stuck in `unknown` may only be
        re-initiated within 5 minutes of a fresh status query — `POST
        /v1/payout-batches/{id}/disburse` throws `TRANSFER_STATUS_UNKNOWN`
        otherwise, so an ambiguous transfer can never be blind-retried into a
        double payout.
        Roles: `finance_operator`, `finance_approver`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathProviderRef'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Transfer status returned; query timestamp recorded.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [provider_ref, status, last_status_query_at]
                        properties:
                          provider_ref: { type: string }
                          status: { type: string, enum: [initiated, processing, paid, failed, unknown] }
                          last_status_query_at: { type: string, format: date-time, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/publisher/earnings:
    get:
      tags: [Earnings]
      summary: Publisher lifecycle balances
      description: |
        Per-currency balances for one publisher. The four lifecycle states are
        kept separate:
        - `pending` — publisher share of conversions still awaiting provider approval, attributed via the click chain (latest approved contract share; 100% fallback when no approved contract exists).
        - `approved` — net `publisher_liability` balance from posted ledger entries.
        - `collected` — merchant cash actually received for the publisher's eligible earnings, pro-rata from `merchant_settlements` (same allocation `prepare()` caps payouts by).
        - `payable` — amounts already in live (non-failed/cancelled) payout batches.

        Suspense (unattributed) conversions are excluded everywhere.
        Any authenticated role.
      parameters:
        - name: publisher_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Balances keyed by currency.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [publisher_id, balances]
                        properties:
                          publisher_id: { $ref: '#/components/schemas/Uuid' }
                          balances:
                            type: object
                            additionalProperties: { $ref: '#/components/schemas/EarningsBalance' }
                            example:
                              INR: { pending: 16000, approved: 11200, collected: 9000, payable: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/programmes/{id}/pause:
    post:
      tags: [Programmes]
      summary: Pause a programme (kill switch)
      description: |
        Effective immediately: status → `paused`; new link creation is blocked
        (`POST /v1/links` → `403 PROGRAMME_NOT_APPROVED`); in-flight redirect
        cache entries (`route:{token}`) are invalidated (Redis best-effort —
        the DB fallback keeps behaviour correct); existing links serve the
        paused page; a `programme.paused` outbox event is emitted and the
        action is written to `audit_log`. The status change, the event and the
        audit row commit in one transaction (the cache invalidation runs after
        the commit): a `500` means none of them took effect. Idempotent:
        pausing an already-paused programme returns 200 with the current state.
        Roles: `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Programme paused.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, status, invalidated_routes, cache_deleted, redis_available]
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          status: { type: string, enum: [paused] }
                          invalidated_routes: { type: integer, description: Route tokens considered for invalidation. }
                          cache_deleted: { type: integer, description: Redis keys actually deleted. }
                          redis_available: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/programmes/{id}/resume:
    post:
      tags: [Programmes]
      summary: Resume a paused programme
      description: |
        `paused` → `active` (+ same route-cache invalidation, so a payload
        cached while paused doesn't keep serving the paused page). Resuming a
        non-paused programme is `409 CONFLICT` (also when a concurrent resume
        won). Emits `programme.resumed` and writes `audit_log`, in the same
        transaction as the status change: a `500` leaves the programme paused.
        Roles: `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Programme resumed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, status, invalidated_routes, cache_deleted, redis_available]
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          status: { type: string, enum: [active] }
                          invalidated_routes: { type: integer }
                          cache_deleted: { type: integer }
                          redis_available: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` — only a paused programme can be resumed.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/publishers:
    post:
      tags: [Publishers]
      summary: Open a publisher application
      description: |
        Creates a publisher in onboarding state `application` (legacy `status`
        `pending`) and emits `publisher.application_received`. Only publishers
        in `active` may mint monetised links.
        Roles: `publisher_owner`, `editor`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name, country]
              properties:
                legal_name: { type: string, minLength: 1, maxLength: 300, example: Dashmani Media Pvt Ltd }
                country: { type: string, minLength: 2, maxLength: 2, example: IN, description: Uppercased server-side. }
      responses:
        '201':
          description: Application opened.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Publisher' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/publishers/{id}:
    get:
      tags: [Publishers]
      summary: Get a publisher
      description: Tenant-scoped read. Any authenticated role.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The publisher.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Publisher' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/publishers/{id}/onboarding/advance:
    post:
      tags: [Publishers]
      summary: Advance publisher onboarding
      description: |
        Moves onboarding forward exactly one step:
        `application → identity_review → property_verification →
        programme_eligibility → contract → active`. Skips are `409 CONFLICT`;
        requesting the current state is a 200 no-op (`advanced: false`).
        Transitions are forward-only in this build. Emits
        `publisher.onboarding_state_changed` and writes `audit_log`.
        Roles: `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/OnboardingState' }
            examples:
              next:
                value: { state: identity_review }
      responses:
        '200':
          description: State advanced (or already there).
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [id, onboarding_state, advanced]
                        properties:
                          id: { $ref: '#/components/schemas/Uuid' }
                          onboarding_state: { $ref: '#/components/schemas/OnboardingState' }
                          advanced: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` — transition skips a step (states advance one at a time).'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/disputes:
    post:
      tags: [Disputes]
      summary: Open a dispute ticket
      description: |
        Opens a ticket for a missing commission or related claim. It may
        reference a known conversion (`wrong_amount` / `unattributed_click`) or
        NO conversion at all (`missing_commission`: the publisher believes a
        sale happened that the provider never reported — identified by
        `claim_ref`, e.g. the merchant's order id). When a conversion is
        named it must belong to this org (`404` otherwise); `publisher_id` is
        derived from the conversion's click chain unless explicitly given.
        A ticket NEVER creates a payable sale on its own.
        Roles: `publisher_owner`, `editor`, `network_admin`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                conversion_id: { $ref: '#/components/schemas/Uuid' }
                publisher_id: { $ref: '#/components/schemas/Uuid' }
                kind: { $ref: '#/components/schemas/DisputeKind', default: missing_commission }
                subject: { type: string, minLength: 1, maxLength: 300, example: Commission missing for order ORD-88412 }
                claim_ref: { type: string, minLength: 1, maxLength: 200, example: ORD-88412 }
                evidence: { type: object, description: Free-form evidence object. }
            examples:
              missing:
                value:
                  kind: missing_commission
                  subject: Commission missing for order ORD-88412
                  claim_ref: ORD-88412
                  evidence: { order_screenshot: attached }
      responses:
        '201':
          description: Ticket opened (status `open`); emits `dispute.opened`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Disputes]
      summary: List disputes
      description: Tenant-scoped list, newest first, with optional filters. Any authenticated role.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DisputeStatus' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/DisputeKind' }
        - name: publisher_id
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Disputes.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/disputes/{id}:
    get:
      tags: [Disputes]
      summary: Get a dispute
      description: Tenant-scoped read. Any authenticated role.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The dispute.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/disputes/{id}/resolve:
    post:
      tags: [Disputes]
      summary: Resolve a dispute
      description: |
        Outcome `resolved` requires `provider_verified: true` plus a resolution
        note describing the provider-side evidence — "screenshots alone never
        create a payable sale" is enforced in code (`422`), not just policy.
        Resolving a missing-commission ticket does NOT post ledger entries:
        the provider must re-report the conversion through the normal webhook
        path (dedupe + revision ordering apply), or finance books a manual
        correction. Emits `dispute.resolved` and writes `audit_log`.
        Roles: `network_admin`, `editor`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, resolution_note, provider_verified]
              properties:
                outcome: { type: string, enum: [resolved, rejected] }
                resolution_note: { type: string, minLength: 10, maxLength: 2000 }
                provider_verified: { type: boolean, description: Must be true for outcome=resolved — the claim was checked against provider records. }
            examples:
              resolve:
                value:
                  outcome: resolved
                  resolution_note: Provider confirmed txn-0001 at revision 2; commission re-reported via webhook.
                  provider_verified: true
      responses:
        '200':
          description: Dispute resolved/rejected.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Dispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` — dispute is already resolved or rejected.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: '`VALIDATION_ERROR` — outcome=resolved requires provider_verified=true.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/contracts:
    post:
      tags: [Contracts]
      summary: Create a contract version (draft)
      description: |
        Creates a NEW version (draft) for a publisher+programme:
        `version = max(existing) + 1`, and `effective_from` must not be earlier
        than the previous version's (`409 CONFLICT` otherwise). Effective-dated:
        ledger posting only considers approved contracts whose `effective_from`
        is null or in the past. Emits `contract.version_created`.
        Roles: `network_admin`, `editor`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher_id, programme_id, publisher_share_bps, effective_from]
              properties:
                publisher_id: { $ref: '#/components/schemas/Uuid' }
                programme_id: { $ref: '#/components/schemas/Uuid' }
                publisher_share_bps: { type: integer, minimum: 0, maximum: 10000, example: 7000, description: Basis points of commission to the publisher (7000 = 70%). }
                payout_threshold_minor: { $ref: '#/components/schemas/MinorUnits', default: 0 }
                effective_from: { $ref: '#/components/schemas/DateTime' }
            examples:
              seventy-thirty:
                value:
                  publisher_id: 99999999-9999-4999-8999-999999999999
                  programme_id: 33333333-3333-4333-8333-333333333333
                  publisher_share_bps: 7000
                  payout_threshold_minor: 50000
                  effective_from: 2026-10-01T00:00:00.000Z
      responses:
        '201':
          description: Draft contract version created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`CONFLICT` — effective_from earlier than the previous version.'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Contracts]
      summary: List contract versions
      description: Versions for a publisher+programme, newest first. Any authenticated role.
      parameters:
        - name: publisher_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: programme_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: Contract versions.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/contracts/{id}/approve:
    post:
      tags: [Contracts]
      summary: Approve a contract draft
      description: |
        Moves a draft to `approved`. Only drafts can be approved
        (`409 CONFLICT` otherwise). Conversions already posted keep their
        `contract_version_id` snapshot forever — a new version never rewrites
        history. Emits `contract.approved` and writes `audit_log`.
        Roles: `network_admin`.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Contract approved.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Idempotent-Replay: { $ref: '#/components/headers/X-Idempotent-Replay' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/Contract' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/public/{org}/spotted:
    get:
      tags: [Public]
      summary: 'The Spotted feed: the latest public celebrity looks'
      description: |
        No token. Published looks whose celebrity's rights allow the name at
        this moment (the read gate: not under takedown, not a minor or
        never-listed, a status and a review that allow at least the name).
        Filters: a celebrity's slug, a storefront's slug (live only). The image
        of each card only while its licence, territory, expiry and frame screen
        allow it. `cache-control: public, max-age=30`.
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
        - name: celebrity
          in: query
          required: false
          schema: { type: string }
        - name: storefront
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/SpottedPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/{org}/trending:
    get:
      tags: [Public]
      summary: 'The trending row: public looks ranked by clicks'
      description: |
        No token. Public looks (the read gate of /spotted) ranked by the human
        clicks on their products' tracked links over the last `days` IST days
        (the workers' hourly rollup, click_daily); ties by publication time.
        The counts are not returned. Empty until the rollup has clicks.
        `cache-control: public, max-age=30`.
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 12, default: 8 }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/SpottedCard' } }
                          days: { type: integer }
                          from: { type: string, format: date }
                          to: { type: string, format: date }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/{org}/celebrities/{slug}:
    get:
      tags: [Public]
      summary: 'A celebrity''s hub'
      description: |
        No token. Only while the celebrity's rights allow the name and at least
        one of their looks is public (404 otherwise); `410 GONE` under a
        takedown. Carries the commercial label and the non-endorsement line.
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 80 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/public/{org}/looks/{id}:
    get:
      tags: [Public]
      summary: 'One look, piece by piece'
      description: |
        No token. The outfit piece by piece: the EXACT product first (approved
        by a second person, with evidence on record; "The same item"), then the
        SIMILAR ones ("Similar style. {name} did not wear or endorse this
        product."). Products and their tracked links only while a shoppable page
        is allowed; the still and the hotspots only while the image may be shown;
        a pending EXACT tag never; an item whose product text names anyone or
        uses endorsement wording never. The headline never names the celebrity
        ("Spotted at <event>"): the name is in `celebrity` and in
        `non_endorsement`, which the page shows as one line at body size.
        `image.url` is the still's own afflino.com path (`/img/looks/<id>?v=…`,
        served by the web from `/looks/{id}/still`); the origin URL never
        appears. `commercial_label` is null when the page carries no products.
        Prices only from the product API inside the programme's age limit.
        `410 GONE` for a withdrawn look that was public once or one whose
        celebrity is under takedown; `404` for anything never public (under a
        takedown too) and for a look whose own text names anyone. Answers are
        kept up to 30 s per URL under the invalidation epoch (every takedown,
        review, publish and edit clears them). Rate-limited per client (429).
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/PublicLook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /v1/public/{org}/looks/{id}/still:
    get:
      tags: [Public]
      summary: 'The still of a look (its own address)'
      description: |
        No token. The image bytes, only while the look page may show the image
        (the celebrity's rights, the look's mode, the licence, the territory,
        the expiry, the chain of title, the frame screen, the exclusion flags —
        every rule, on every request); fetched by the api from the origin file,
        whose address never reaches the public. `max-age=30`. `410` after a
        takedown of a look that was public; `404` otherwise; `502` when the
        origin cannot be read. The web serves it as `/img/looks/<id>`.
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
        - $ref: '#/components/parameters/PathId'
        - name: v
          in: query
          required: false
          schema: { type: string, pattern: '^[0-9a-f]{1,16}$' }
      responses:
        '200':
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: '502 — the origin file could not be read (UPSTREAM_UNAVAILABLE).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/public/{org}/storefronts/{slug}:
    get:
      tags: [Public]
      summary: 'An in-house page''s storefront (link in bio)'
      description: |
        No token. A live storefront of an approved, owner-operated in-house page,
        with that page's public looks (the same read gate as the feed).
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 80 }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/{org}/sitemap:
    get:
      tags: [Public]
      summary: 'What a sitemap may list'
      description: |
        No token. Public looks (id, updated_at), the celebrity hubs that have
        one, live storefronts. A taken-down or downgraded celebrity is absent at
        once. Whether celebrity pages are indexed is the web's decision.
      security: []
      parameters:
        - name: org
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 63, example: afflino }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/celebrities:
    get:
      tags: [Celebrities]
      summary: 'List celebrities'
      description: |
        Roles: network_admin, editor, rights_reviewer. Includes the capability matrix.
      parameters:
