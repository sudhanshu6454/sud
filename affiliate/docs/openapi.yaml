      summary: 'Publish or unpublish'
      description: |
        Roles: network_admin, editor. `published` runs the publish gate (409
        with `gate`, the whole report, when any check fails): the celebrity's
        rights allow the look's display mode; a shown still has a licence
        allowing commercial reuse in India that has not expired and a passed
        frame screen; the moment has a past date and an approved owner-operated
        Facebook / Instagram page; every piece has an approved product; every
        EXACT tag is reviewed; no takedown; the link rules (Amazon) hold. Then
        the look's own links are minted. Unpublishing pauses them at once.
        `withdrawn` is reached only by a takedown (410).
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
