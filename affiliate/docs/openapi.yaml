                offer_id: { $ref: '#/components/schemas/Uuid' }
                match_type: { type: string, enum: [exact, similar], default: similar }
                evidence: { type: [string, 'null'], maxLength: 2000 }
                evidence_source: { type: [string, 'null'], maxLength: 500 }
                evidence_captured_at: { type: [string, 'null'], format: date-time }
                position: { type: integer }
      responses:
        '201':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
