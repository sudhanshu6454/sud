    post:
      tags: [Editorial]
      summary: 'Tag a product into a piece'
      description: |
        Roles: network_admin, editor. SIMILAR (the default): several per piece,
        ordered; the product's own text may not name the celebrity or use an
        endorsement phrase (422). EXACT: at most one per piece (409), only with
        evidence (what it shows, its source; 422 otherwise), `pending` until a
        different person approves it. A product once per piece (409).
      parameters:
