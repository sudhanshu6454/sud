  /v1/integrations/meta/webhook:
    get:
      tags: [Replies]
      summary: 'Meta''s webhook verification'
      description: |
        No token. `hub.mode=subscribe` and `hub.verify_token` equal to META_VERIFY_TOKEN (constant-time) → the `hub.challenge` as text/plain; 403 otherwise; 503 while unset.
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema: { type: string }
        - name: hub.verify_token
          in: query
          required: false
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            text/plain:
              schema: { type: string }
        '503': { $ref: '#/components/responses/Unavailable' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Replies]
      summary: 'Meta webhook deliveries (comments, messages)'
      description: |
        No bearer token: `X-Hub-Signature-256` = sha256 HMAC of the RAW body
        with META_APP_SECRET (401 when missing or wrong; 503 while META_APP_SECRET
        or COMMENT_ID_HASH_KEY is unset). Instagram `comments` (both payload
        shapes) and Facebook `feed` comments (verb add only) on a rule's post
        with one of its keywords become one reply event each (idempotent on the
        comment id); the account's own comments are dropped; STOP adds the author
        to the opt-out list. Only keyed hashes are stored. Answers 200 at once.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Meta's delivery, read as raw bytes (the signature covers them).
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/integrations/meta/data-deletion:
    post:
      tags: [Replies]
      summary: 'Meta''s data deletion callback'
      description: |
        No bearer token (App settings > Basic > Data deletion). The form field
        `signed_request` = base64url(signature) "." base64url(payload), the
        signature HMAC-SHA256(META_APP_SECRET, the encoded payload), checked in
        constant time (401 otherwise; 503 while META_APP_SECRET or
        COMMENT_ID_HASH_KEY is unset). Every reply event whose commenter hash is
        that person's (on any mapped in-house account) is deleted; the opt-out
        list keeps its hash (it stops any message to them; counsel's question).
        Answers `{ url, confirmation_code }` as Meta requires (no envelope).
        Rate-limited per client (429).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [signed_request]
              properties:
                signed_request: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [url, confirmation_code]
                properties:
                  url: { type: string, format: uri }
                  confirmation_code: { type: string, pattern: '^[0-9a-f]{16}$' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/analytics/clicks:
    get:
      tags: [Analytics]
      summary: 'Human clicks from the daily rollups'
      description: |
        Roles: network_admin, editor (the whole organisation's figures: a creator's are GET /v1/publisher/earnings). IST days, at most 366; grouped by day, look, celebrity, piece, property (the in-house page), link or via (the page surface), summed in SQL.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: group_by
          in: query
          required: false
          schema: { type: string, enum: [day, look, celebrity, piece, property, link, via], default: day }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/analytics/replies:
    get:
      tags: [Analytics]
      summary: 'Comment-reply counts from the daily rollups'
      description: |
        Roles: network_admin, editor. Per day and per rule: received, sent, skipped, failed.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
