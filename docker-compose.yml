    - wp
  autopub:
    build: ./autopub
    container_name: autopub
    restart: unless-stopped
    env_file:
    - path: .env
      required: false
    environment:
      AUTOPUB_WP_INTERNAL: 'true'
      AUTOPUB_CONFIG: /app/config/sites.yaml
      AUTOPUB_DATA_DIR: /data
      OPENSEO_URL: ${OPENSEO_URL:-http://openseo:3001/mcp}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
    - autopub_data:/data
    - ./autopub/config:/app/config:ro
    depends_on:
    - wp_mentalist
    - wp_crazy
    - wp_junkies
    - wp_screenstat
    - wp_filmybuff
    networks:
    - internal
    - web
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  openseo:
    image: ${OPEN_SEO_IMAGE:-ghcr.io/every-app/open-seo:latest}
    container_name: openseo
    restart: unless-stopped
    env_file:
    - path: .env
      required: false
    environment:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'true'
      PORT: '3001'
      AUTH_MODE: local_noauth
      ALLOWED_HOST: ${OPENSEO_ALLOWED_HOST:-}
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENSEO_TELEMETRY_DISABLED: ${OPENSEO_TELEMETRY_DISABLED:-1}
      VITE_SHOW_DEVTOOLS: 'false'
      TZ: ${TZ:-Asia/Kolkata}
    ports:
    - 127.0.0.1:3001:3001
    volumes:
    - openseo_data:/app/.wrangler
    networks:
    - internal
    - web
  pulse_worker:
    build: ./pulse-worker
    container_name: pulse_worker
    restart: unless-stopped
    env_file:
    - path: .env
      required: false
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
    - pulse_worker_data:/app/data
    - ./pulse-worker/config:/app/config
    networks:
    - web
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  affiliate_db:
    image: postgres:16-alpine
    container_name: affiliate_db
    profiles:
    - affiliate
    restart: unless-stopped
    environment:
      POSTGRES_USER: paparazzi
      POSTGRES_DB: paparazzi
      POSTGRES_PASSWORD: ${AFFILIATE_DB_PASSWORD:-}
    volumes:
    - affiliate_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U paparazzi -d paparazzi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - internal
  affiliate_redis:
    image: redis:7-alpine
    container_name: affiliate_redis
    profiles:
    - affiliate
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - affiliate_redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
    - internal
  affiliate_migrate:
    build:
      context: ./affiliate
      dockerfile: docker/Dockerfile.migrate
    profiles:
    - affiliate
    restart: 'no'
    depends_on:
      affiliate_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://paparazzi:${AFFILIATE_DB_PASSWORD:-}@affiliate_db:5432/paparazzi
      FLEET_SITES_YAML: /app/config/sites.yaml
      AFFILIATE_WEB_HOST: ${AFFILIATE_WEB_HOST:-}
    volumes:
    - ./autopub/config:/app/config:ro
    networks:
    - internal
  affiliate_api:
    build:
      context: ./affiliate
      dockerfile: docker/Dockerfile.api
    container_name: affiliate_api
    profiles:
    - affiliate
    restart: unless-stopped
    depends_on: &id001
      affiliate_migrate:
        condition: service_completed_successfully
      affiliate_redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      DATABASE_URL: postgresql://paparazzi:${AFFILIATE_DB_PASSWORD:-}@affiliate_db:5432/paparazzi
      REDIS_URL: redis://affiliate_redis:6379
      JWT_SECRET: ${AFFILIATE_JWT_SECRET:-}
      REDIRECT_BASE_URL: https://${AFFILIATE_LINK_HOST:-}
      VIRTUAL_HOST: ${AFFILIATE_API_HOST:-}
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: ${AFFILIATE_API_HOST:-}
      HSTS: max-age=31536000; includeSubDomains
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
    - web
    - internal
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
  affiliate_redirect:
    build:
      context: ./affiliate
      dockerfile: docker/Dockerfile.redirect
    container_name: affiliate_redirect
    profiles:
    - affiliate
    restart: unless-stopped
    depends_on: *id001
    environment:
      NODE_ENV: production
      REDIRECT_PORT: '3001'
      DATABASE_URL: postgresql://paparazzi:${AFFILIATE_DB_PASSWORD:-}@affiliate_db:5432/paparazzi
      REDIS_URL: redis://affiliate_redis:6379
      VIRTUAL_HOST: ${AFFILIATE_LINK_HOST:-}
      VIRTUAL_PORT: '3001'
      LETSENCRYPT_HOST: ${AFFILIATE_LINK_HOST:-}
      HSTS: max-age=31536000; includeSubDomains
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
    - web
    - internal
    cap_drop: *id002
    security_opt: *id003
  affiliate_workers:
    build:
      context: ./affiliate
      dockerfile: docker/Dockerfile.workers
    container_name: affiliate_workers
    profiles:
    - affiliate
    restart: unless-stopped
    depends_on: *id001
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://paparazzi:${AFFILIATE_DB_PASSWORD:-}@affiliate_db:5432/paparazzi
      REDIS_URL: redis://affiliate_redis:6379
      STUB_WEBHOOK_SECRET: ${AFFILIATE_STUB_WEBHOOK_SECRET:-}
      RETENTION_CLICK_CONTEXT_DAYS: ${AFFILIATE_RETENTION_CLICK_CONTEXT_DAYS:-365}
      RETENTION_CONVERSION_RAW_DAYS: ${AFFILIATE_RETENTION_CONVERSION_RAW_DAYS:-365}
      RETENTION_OUTBOX_DAYS: ${AFFILIATE_RETENTION_OUTBOX_DAYS:-365}
      RETENTION_CRON: ${AFFILIATE_RETENTION_CRON:-0 3 * * *}
    networks:
    - internal
    cap_drop: *id002
    security_opt: *id003
  affiliate_web:
    build:
      context: ./affiliate
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: /api
    container_name: affiliate_web
    profiles:
    - affiliate
    restart: unless-stopped
    depends_on:
    - affiliate_api
    environment:
      NODE_ENV: production
      API_BASE: http://affiliate_api:3000
      WEB_API_TOKEN: ${AFFILIATE_WEB_API_TOKEN:-}
      WEB_PLACEMENT_ID: ${AFFILIATE_WEB_PLACEMENT_ID:-}
      NEXT_PUBLIC_SITE_NAME: ${AFFILIATE_SITE_NAME:-Paparazzi Commerce}
      VIRTUAL_HOST: ${AFFILIATE_WEB_HOST:-}
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: ${AFFILIATE_WEB_HOST:-}
      HSTS: max-age=31536000; includeSubDomains
    networks:
    - web
    - internal
    cap_drop: *id002
    security_opt: *id003
networks:
  web: {}
  internal: {}
volumes:
  proxy_certs: {}
  proxy_vhost: {}
  proxy_html: {}
  acme_state: {}
  db_data: {}
  autopub_data: {}
  wp_mentalist_data: {}
  wp_crazy_data: {}
  wp_junkies_data: {}
  wp_screenstat_data: {}
  wp_filmybuff_data: {}
  openseo_data: {}
  pulse_worker_data: {}
