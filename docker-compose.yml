# GENERATED by infra/gen_compose.py from autopub/config/sites.yaml - edit sites.yaml, then `make compose`.
name: marketing-fleet
services:
  proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: proxy
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    environment:
      TRUST_DOWNSTREAM_PROXY: 'false'
    volumes:
    - /var/run/docker.sock:/tmp/docker.sock:ro
    - proxy_certs:/etc/nginx/certs
    - proxy_vhost:/etc/nginx/vhost.d
    - proxy_html:/usr/share/nginx/html
    - ./infra/proxy/client_max_body_size.conf:/etc/nginx/conf.d/client_max_body_size.conf:ro
    - ./infra/proxy/hardening.conf:/etc/nginx/conf.d/hardening.conf:ro
    networks:
    - web
  acme:
    image: nginxproxy/acme-companion:2.4
    restart: unless-stopped
    depends_on:
    - proxy
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
      NGINX_PROXY_CONTAINER: proxy
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - proxy_certs:/etc/nginx/certs
    - proxy_vhost:/etc/nginx/vhost.d
    - proxy_html:/usr/share/nginx/html
    - acme_state:/etc/acme.sh
    networks:
    - web
  db:
    image: mariadb:11
    restart: unless-stopped
    command:
    - --max-allowed-packet=64M
    - --innodb-buffer-pool-size=256M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SITE_KEYS: MENTALIST,CRAZY,JUNKIES,SCREENSTAT,FILMYBUFF
      WP_MENTALIST_DB_PASSWORD: ${WP_MENTALIST_DB_PASSWORD}
      WP_CRAZY_DB_PASSWORD: ${WP_CRAZY_DB_PASSWORD}
      WP_JUNKIES_DB_PASSWORD: ${WP_JUNKIES_DB_PASSWORD}
      WP_SCREENSTAT_DB_PASSWORD: ${WP_SCREENSTAT_DB_PASSWORD}
      WP_FILMYBUFF_DB_PASSWORD: ${WP_FILMYBUFF_DB_PASSWORD}
    volumes:
    - db_data:/var/lib/mysql
    - ./infra/db/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
    - internal
  wp_mentalist:
    image: wordpress:6-php8.3-apache
    container_name: wp_mentalist
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp_mentalist
      WORDPRESS_DB_USER: wp_mentalist
      WORDPRESS_DB_PASSWORD: ${WP_MENTALIST_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: 'define(''WP_HOME'', ''https://marketingmentalist.in'');

        define(''WP_SITEURL'', ''https://marketingmentalist.in'');

        define(''WP_MEMORY_LIMIT'', ''256M'');

        define(''DISALLOW_FILE_EDIT'', true);

        define(''FORCE_SSL_ADMIN'', true);

        define(''WP_POST_REVISIONS'', 10);

        define(''WP_AUTO_UPDATE_CORE'', ''minor'');

        '
      VIRTUAL_HOST: marketingmentalist.in,www.marketingmentalist.in
      LETSENCRYPT_HOST: marketingmentalist.in,www.marketingmentalist.in
      HSTS: max-age=31536000; includeSubDomains
    volumes:
    - wp_mentalist_data:/var/www/html
    - ./infra/wp/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
    - web
    - internal
  cli_mentalist:
    image: wordpress:cli-php8.3
    profiles:
    - cli
    user: '33:33'
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp_mentalist
